:root{--ink:#1a1238;--cream:#fff6e0;--red:#e2362f;--gold:#ffc83a;--purple:#6b2fa8;--green:#2f9a4a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#120c28;overflow:hidden;font-family:Nunito,system-ui,sans-serif;color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#app{position:absolute;left:50%;top:50%;transform-origin:center center;width:960px;height:540px;margin-left:-480px;margin-top:-270px;box-shadow:0 0 0 4px #000,0 10px 60px #000}
canvas{display:block;width:960px;height:540px}
.btnbar{position:fixed;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));display:flex;gap:8px;z-index:30}
.btnbar button{width:44px;height:44px;border-radius:12px;border:3px solid #000;background:var(--cream);font-size:20px;box-shadow:0 3px 0 #000;cursor:pointer}
#touch{position:fixed;inset:0;pointer-events:none;z-index:20;display:none}
#touch .pad{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));pointer-events:auto;touch-action:none}
#touch .l{left:max(16px,env(safe-area-inset-left));width:216px;height:178px}
#touch .r{right:max(16px,env(safe-area-inset-right));width:200px;height:170px}
#touch button{pointer-events:none;border-radius:50%;border:4px solid rgba(0,0,0,.75);background:rgba(255,246,224,.5);font-weight:900;color:#1a1238;touch-action:none;position:absolute;font-family:inherit}
#touch .l [data-k=left]{left:0;bottom:0;width:92px;height:92px;font-size:34px}
#touch .l [data-k=right]{left:116px;bottom:0;width:92px;height:92px;font-size:34px}
#touch .l [data-k=down]{left:66px;bottom:100px;width:70px;height:70px;font-size:26px}
#touch .r #bJump{right:0;bottom:0;width:104px;height:104px;font-size:38px}
#touch .r #bAct{right:108px;bottom:62px;width:80px;height:80px;font-size:30px}
#touch button.on{background:rgba(255,200,58,.9);transform:scale(.93)}
@media (max-height:360px){#touch .l [data-k=left],#touch .l [data-k=right]{width:78px;height:78px}#touch .l [data-k=right]{left:98px}#touch .l [data-k=down]{left:54px;bottom:84px;width:62px;height:62px}#touch .r #bJump{width:90px;height:90px}#touch .r #bAct{width:70px;height:70px;right:96px;bottom:54px}}
#ov{position:fixed;inset:0;z-index:40;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:rgba(18,12,40,.72);backdrop-filter:blur(3px)}
#ov.show{display:block}
.card{max-width:780px;margin:22px auto;background:var(--cream);border:4px solid #000;border-radius:22px;box-shadow:0 8px 0 #000;padding:22px 22px 18px;position:relative}
.title{font-family:'Luckiest Guy',Impact,sans-serif;letter-spacing:1px;line-height:1;color:var(--red);text-shadow:3px 3px 0 #000;-webkit-text-stroke:1.5px #000}
h1.title{font-size:clamp(34px,7vw,64px);margin:4px 0 6px;text-align:center}
h2.title{font-size:clamp(24px,4.6vw,38px);margin:0 0 10px}
.sub{text-align:center;font-weight:800;margin:0 0 4px}
.tiny{font-size:13px;opacity:.75}
.warn{display:inline-block;background:#000;color:var(--gold);font-weight:900;border-radius:8px;padding:2px 8px;font-size:13px}
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;font-family:'Luckiest Guy',Impact,sans-serif;font-size:22px;letter-spacing:1px;padding:12px 20px;border-radius:16px;border:4px solid #000;background:var(--gold);color:#1a1238;box-shadow:0 5px 0 #000;cursor:pointer;margin:6px 4px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #000}
.btn.alt{background:#fff}
.center{text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:10px}
.chap{border:3px solid #000;border-radius:16px;background:#fff;padding:10px;cursor:pointer;box-shadow:0 4px 0 #000;text-align:left;font-family:inherit;color:inherit}
.chap .n{font-family:'Luckiest Guy',Impact;font-size:15px;color:var(--purple)}
.chap .e{font-size:30px;line-height:1.2}
.chap .t{font-weight:900;font-size:15px;line-height:1.1}
.chap .s{font-size:12px;margin-top:3px}
.chap.lock{opacity:.45;filter:grayscale(1);cursor:not-allowed}
.story p{font-size:17px;line-height:1.45;margin:8px 0}
.who{display:flex;gap:14px;align-items:center;background:#fff;border:3px solid #000;border-radius:16px;padding:8px 12px;margin:12px 0}
.who canvas{width:84px;height:96px;flex:none}
.quote{font-style:italic;background:#ffe9b0;border-left:6px solid var(--red);padding:6px 10px;border-radius:8px;font-weight:800}
.pedia{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.pe{display:flex;gap:10px;align-items:center;background:#fff;border:3px solid #000;border-radius:14px;padding:6px 10px}
.pe canvas{width:56px;height:64px;flex:none}
.pe b{display:block;font-size:15px;line-height:1.1}
.pe span{font-size:13px;line-height:1.25;display:block}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-weight:700}
kbd{background:#fff;border:2px solid #000;border-radius:6px;padding:0 6px;font-family:inherit;font-weight:900}
.map{width:100%;max-width:520px;display:block;margin:6px auto}
.sel{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px;margin-top:8px}
.ch{position:relative;border:3px solid #000;border-radius:16px;background:#fff;padding:8px 10px 10px;cursor:pointer;box-shadow:0 4px 0 #000;text-align:left;font-family:inherit;color:inherit;display:flex;flex-direction:column;align-items:center}
.ch:active{transform:translateY(2px);box-shadow:0 2px 0 #000}
.ch canvas{width:70px;height:80px}
.ch b{font-size:14px;line-height:1.1;text-align:center;margin:2px 0 4px}
.ch .ab{font-size:12px;font-weight:900;background:#ffe9b0;border-radius:8px;padding:1px 6px;margin-bottom:5px;text-align:center}

function drawEarth(c,x,y,r){
  const g=c.createRadialGradient(x-r*.3,y-r*.3,r*.2,x,y,r);g.addColorStop(0,'#6ec6ff');g.addColorStop(1,'#1d5fb8');
  c.fillStyle='rgba(180,220,255,.25)';c.beginPath();c.arc(x,y,r+8,0,7);c.fill();
  c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,7);c.fill();
  c.save();c.beginPath();c.arc(x,y,r,0,7);c.clip();c.fillStyle='#4caf50';
  c.beginPath();c.ellipse(x-r*.25,y-r*.15,r*.32,r*.45,.4,0,7);c.fill();
  c.beginPath();c.ellipse(x+r*.35,y+r*.2,r*.22,r*.3,-.3,0,7);c.fill();
  c.beginPath();c.ellipse(x+r*.1,y-r*.6,r*.2,r*.12,0,0,7);c.fill();
  c.restore();
}

      else{c.beginPath();c.arc(x,440,50+hash(i,9)*40,Math.PI,0);c.fill();}}}

function buildGrid(seq){const rows=[];for(let i=0;i<ROWS;i++)rows.push('');seq.forEach(n=>{const parts=n==='hill'?['hillU','hillD']:n==='goal'?['goal','goal2']:[n];parts.forEach(p=>{const ch=CH[p];if(!ch)throw new Error('chunk '+p);for(let i=0;i<ROWS;i++)rows[i]+=ch[i];});});return rows;}
function bossGrid(){const r=[];const cols=26;for(let y=0;y<ROWS;y++){let s='';for(let x=0;x<cols;x++){let ch='.';if(x===0||x===cols-1)ch='#';if(y>=11)ch='#';if(y===8&&((x>=3&&x<=6)||(x>=19&&x<=22)))ch='=';if(y===4&&x>=10&&x<=15)ch='=';if(y===10&&x===3)ch='P';if(y===10&&x===19)ch='X';if(y===7&&x===4)ch='h';if(y===6&&x===21)ch='h';if(y===7&&x===12)ch='W';if(y===7&&x===13)ch='?';if(y===3&&(x===11||x===13||x===15))ch='o';if(y===10&&(x===7||x===9||x===15))ch='o';s+=ch;}r.push(s);}return r;}

   P_+'Cuatro avionetas celestes y blancas despegan hacia Lavalandia: una la pilota Franky, las otras tres, gente del Cártel. Los Pajaritas Fader van metidos en una maleta. Y nadie ha calculado el combustible…'+_P,

   P_+'Llega <b>Doña Matilde</b>, la orangutana, con bambo de lunares y pamela, de la mano de <b>Pelito Meado</b>: pañales talla XXL, chaleco de hojas de platanero y un capirote de plumas de papagayo… que atrae a una bandada de <b>gaviotas kamikazes</b>.'+_P,

function makeEnemy(spec,sk,tx,ty){if(sk.costume&&!sk.lo)sk.lo=Object.assign({},LOOKS[sk.look],{costume:sk.costume});
  const isP=!!sk.look;const w=isP?26:Math.round((sk.size||36)*0.8),h=isP?46:Math.round((sk.size||36)*0.75);

  if(e.kind==='flyer'||e.kind==='diver'){e.y=ty*T;e.by=ty*T;}
  if(e.kind==='jumper'){e.by=11*T+6;e.y=e.by;e.st=Math.random()*80;}
  if(e.kind==='thrower'){e.st=Math.random()*60;}
  return e;
}
function makeBoss(x,y,bd){const w=bd.emoji?Math.round(bd.size*.62):Math.round(26*bd.scale*1.1),h=bd.emoji?Math.round(bd.size*.7):Math.round(50*bd.scale);
  return {bd,x:x-w/2,y:y-h,w,h,vx:0,vy:0,hp:bd.hp,maxhp:bd.hp,state:'intro',st:0,face:-1,onGround:false,flash:0,calm:false,bubble:{text:bd.quotes[0],t:150},talk:200};}

function tileAt(tx,ty){if(ty<0||ty>=L.rows)return '.';if(tx<0||tx>=L.cols)return '#';return L.grid[ty][tx];}
function moveBody(b){
  b.x+=b.vx;let x0=Math.floor(b.x/T),x1=Math.floor((b.x+b.w-.01)/T),y0=Math.floor(b.y/T),y1=Math.floor((b.y+b.h-.01)/T);b.hitWall=false;
  if(b.vx>0){for(let ty=y0;ty<=y1;ty++)if(solid(tileAt(x1,ty))){b.x=x1*T-b.w;b.vx=0;b.hitWall=true;break;}}
  else if(b.vx<0){for(let ty=y0;ty<=y1;ty++)if(solid(tileAt(x0,ty))){b.x=(x0+1)*T;b.vx=0;b.hitWall=true;break;}}
  const pb=b.y+b.h;b.y+=b.vy;b.onGround=false;b.hitHead=null;
  x0=Math.floor(b.x/T);x1=Math.floor((b.x+b.w-.01)/T);y0=Math.floor(b.y/T);y1=Math.floor((b.y+b.h-.01)/T);
  if(b.vy>0){for(let tx=x0;tx<=x1;tx++){const c=tileAt(tx,y1);if(solid(c)||(c==='='&&pb<=y1*T+1)){b.y=y1*T-b.h;b.vy=0;b.onGround=true;break;}}}
  else if(b.vy<0){let best=null,bd=1e9;const cx=b.x+b.w/2;for(let tx=x0;tx<=x1;tx++)if(solid(tileAt(tx,y0))){const dd=Math.abs(tx*T+T/2-cx);if(dd<bd){bd=dd;best=tx;}}
    if(best!==null){b.y=(y0+1)*T;b.vy=0;b.hitHead={tx:best,ty:y0};}}
}
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function overlapTile(b,ch,inset){const x0=Math.floor(b.x/T),x1=Math.floor((b.x+b.w-1)/T),y0=Math.floor(b.y/T),y1=Math.floor((b.y+b.h-1)/T);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)if(tileAt(tx,ty)===ch){const r={x:tx*T+inset.x,y:ty*T+inset.y,w:T-inset.x*2,h:T-inset.y};if(ov(b,r))return true;}return false;}

function burst(x,y,col,n){for(let i=0;i<(n||10);i++)L.parts.push({x,y,vx:rnd(-3,3),vy:rnd(-5,1),l:30+Math.random()*20,c:col||'#fff',s:rnd(3,6)});}

function addScore(n,x,y){L.score+=n;if(x!==undefined)ftext(x,y,String(n),'#fff');}
function addRings(n){const before=Math.floor(L.rings/100);L.rings+=n;L.got+=n;L.score+=10*n;if(Math.floor(L.rings/100)>before){L.lives++;SFX.oneup();ftext(L.p.x+13,L.p.y-30,'¡1 VIDA!','#7aff9a');}}

/* ---------- daño y muerte ---------- */
function hurt(fromX){
  const p=L.p;if(L.done||p.dead)return;
  if(L.def.mode==='fly'){if(p.inv>0)return;p.hearts--;p.inv=90;p.vy=-5;SFX.hit();L.shake=10;burst(p.x+p.w/2,p.y+10,'#ff4a4a',12);if(p.hearts<=0)gameOver();return;}
  if(p.inv>0||p.star>0||p.ssj>0||(p.liebre>0&&Math.abs(p.vx)>5))return;
  L.shake=8;
  if(p.ride){dismount(true);p.inv=110;p.vy=-8;SFX.shrink();return;}
  if(p.big){p.big=false;p.fire=false;p.inv=110;SFX.shrink();ftext(p.x+13,p.y-20,'¡Ay!','#ffb0b0');return;}
  if(L.rings>0){scatterRings();p.inv=110;p.vy=-7;p.vx=(p.x+p.w/2<fromX?-4:4);p.roll=false;SFX.ringloss();return;}
  die();
}
function scatterRings(){const p=L.p;const n=Math.min(L.rings,24);for(let i=0;i<n;i++){const a=(i/n)*Math.PI*2,s=3+(i%3)*1.6;L.loose.push({x:p.x+p.w/2,y:p.y+p.h/2,vx:Math.cos(a)*s,vy:-Math.abs(Math.sin(a))*s-2,l:320,ready:35});}L.rings=0;}
function dismount(hit){const p=L.p;if(!p.ride)return;const R=RIDES[p.ride.type];L.parts.push({x:p.x,y:p.y+20,vx:hit?-p.face*5:0,vy:-6,l:70,c:'#888',s:2,emo:R.e||'🥒'});ftext(p.x+13,p.y-20,hit?'¡Te has caído!':'¡Se acabó el viaje!','#ffb0b0');p.ride=null;p.dbl=true;}
function die(){const p=L.p;if(p.dead||L.done)return;p.dead=true;p.deadT=0;p.vy=-11;p.vx=0;p.roll=false;SFX.die();L.shake=10;}
function afterDeath(){const p=L.p;L.lives--;if(L.lives<=0){gameOver();return;}
  p.ride=null;p.ssj=0;p.liebre=0;p.pipe=null;p.loop=null;L.zone={x0:0,x1:L.mainW};p.dead=false;p.x=p.rx;p.y=p.ry;p.vx=0;p.vy=0;p.inv=100;p.big=!!L.ch.tough;p.fire=false;p.star=0;p.roll=false;p.crouch=false;p.h=46;if(p.big){p.h=58;p.y-=12;}
  L.rings=0;L.loose=[];L.camx=clamp(p.x-W*.4,0,L.mainW-W);}

function update(){
  if(!L||L.def.mode==='pen')return;
  L.t++;const d=L.def,p=L.p;
  if(L.freeze>0){L.freeze--;if(L.t%3===0)L.shake=6;for(const q of L.parts){q.x+=q.vx;q.y+=q.vy;q.l--;}L.parts=L.parts.filter(q=>q.l>0);if(L.t%2===0)L.parts.push({x:p.x+p.w/2+rnd(-30,30),y:p.y+p.h,vx:0,vy:-rnd(3,7),l:30,c:'#ffe14a',s:5});return;}
  if(L.shake>0)L.shake--;
  if(L.th.dark){if(L.lightning>0)L.lightning--;else if(Math.random()<.0035){L.lightning=14;setTimeout(thunder,220);}}
  if(d.mode==='fly')updateFly();else updatePlat();
  const tick=L.slow>0?(L.t%2===0):true;
  if(tick){for(const e of L.enemies)updateEnemy(e);if(L.boss)updateBoss();}
  if(L.boss)bossEvent2();
  if(d.mode!=='fly')archUpdate();
  L.enemies=L.enemies.filter(e=>!(e.dead&&e.dt>90));
  // proyectiles jugador
  for(const b of L.pproj){b.x+=b.vx;b.y+=b.vy||0;b.l--;b.rot=(b.rot||0)+.35;
    if(d.mode!=='fly'){const c=tileAt(Math.floor(b.x/T),Math.floor(b.y/T));if(solid(c)){b.l=0;burst(b.x,b.y,b.col,6);}}
    const bs=b.k==='beam'?22:12;for(const e of L.enemies){if(!e.dead&&b.l>0&&!(e.kind==='piper'&&e.hidden)&&ov({x:b.x-bs,y:b.y-bs,w:bs*2,h:bs*2},e)){killEnemy(e);if(!b.pierce)b.l=0;}}
    if(L.boss&&!L.boss.calm&&b.l>0&&ov({x:b.x-bs,y:b.y-bs,w:bs*2,h:bs*2},L.boss)){hitBoss();if(!b.pierce)b.l=0;}
  }
  L.pproj=L.pproj.filter(b=>b.l>0);
  // proyectiles enemigos
  if(tick){for(const b of L.eproj){b.x+=b.vx;b.y+=b.vy;b.vy+=b.g||0;b.l--;b.rot=(b.rot||0)+.2;
    if(!p.dead&&ov({x:b.x-11,y:b.y-11,w:22,h:22},p)){if(p.star>0||p.dash>0||p.ssj>0){b.l=0;burst(b.x,b.y,'#fff',6);}else{hurt(b.x);b.l=0;}}
    if(b.y>H+80)b.l=0;}}
  L.eproj=L.eproj.filter(b=>b.l>0);
  // objetos
  for(const it of L.items){if(it.got)continue;const r={x:it.x-16,y:it.y-16,w:32,h:32};
    if(!p.dead&&ov(r,p)){it.got=true;
      if(it.k==='gem'){store.gems=store.gems||{};store.gems[d.id]=true;save();SFX.oneup();L.gotGem=true;addScore(2000);ftext(it.x,it.y-20,'¡JOYA DEL REY!','#7affea');burst(it.x,it.y,'#7affea',20);say('¡Una joya del rey!',{ifIdle:true,interrupt:false});}
      else if(it.k==='coin'){if(d.mode==='fly'){L.got++;L.score+=10;SFX.coin();if(d.fuel)L.fuel=Math.min(100,L.fuel+16);}else{addRings(1);SFX.coin();}burst(it.x,it.y,'#ffe066',4);}
      else{SFX.heal();if(d.mode==='fly'){if(p.hearts<p.maxH)p.hearts++;ftext(it.x,it.y-10,'+❤','#ff8a8a');}else if(!p.big){grow();}else{addRings(10);ftext(it.x,it.y-10,'+10','#ffe066');}}}}
  // moritas sueltas
  for(const r of L.loose){r.vy+=.28;r.x+=r.vx;r.y+=r.vy;r.l--;if(r.ready>0)r.ready--;
    const c=tileAt(Math.floor(r.x/T),Math.floor((r.y+9)/T));if(r.vy>0&&solid(c)){r.y=Math.floor((r.y+9)/T)*T-9;r.vy*=-.72;r.vx*=.9;}
    const cs=tileAt(Math.floor((r.x+(r.vx>0?9:-9))/T),Math.floor(r.y/T));if(solid(cs))r.vx*=-1;
    if(r.ready<=0&&!p.dead&&ov({x:r.x-12,y:r.y-12,w:24,h:24},p)){r.l=0;addRings(1);SFX.coin();}}
  L.loose=L.loose.filter(r=>r.l>0&&r.y<ROWS*T+40);
  // monedas que saltan de bloques

  if(p.inv>0)p.inv--;if(p.cool>0)p.cool--;if(p.star>0)p.star--;if(p.dash>0)p.dash--;if(L.slow>0)L.slow--;if(p.swing>0)p.swing--;
  if(!L.done&&L.def.mode==='plat'){L.time--;if(L.time<=0){L.time=400*60;die();return;}}
  if(L.done){goalSequence();return;}
  if(!L.done&&keys.down&&!p.ride&&tryPipe())return;
  const onG=p.onGround;
  const R=p.ride?RIDES[p.ride.type]:null;
  if(R){p.ride.t--;if(p.ride.t<=0)dismount(false);}
  let maxS=(R?R.spd:ch.spd)*(p.star>0?1.2:1);if(p.ssj>0)maxS*=1.3;if(p.liebre>0)maxS=Math.max(maxS,15);if(L.th.underwater)maxS*=.62;
  if(R){p.crouch=false;p.roll=false;p.spin=0;}
  // agacharse / carga de rodar
  if(!R&&onG&&keys.down&&!p.roll&&Math.abs(p.vx)<1.5){
    p.crouch=true;p.vx*=.82;
    if(pressed.jump){p.spin=Math.min(14,p.spin+3.6);SFX.rev();burst(p.x+p.w/2-p.face*14,p.y+p.h,'#fff',5);}
    p.spin*=.985;
  }else{
    if(p.crouch&&p.spin>.5){p.roll=true;p.vx=p.face*(8+p.spin);SFX.dash();burst(p.x+p.w/2,p.y+p.h,'#fff',10);}
    p.crouch=false;p.spin=0;
  }
  if(!R&&onG&&keys.down&&Math.abs(p.vx)>=2.6&&!p.roll){p.roll=true;SFX.roll();}
  if(p.roll){if(onG){p.vx*=.993;if(keys.left&&p.vx>0)p.vx-=.14;if(keys.right&&p.vx<0)p.vx+=.14;}
    if(onG&&Math.abs(p.vx)<1.3)p.roll=false;p.face=p.vx>0?1:p.vx<0?-1:p.face;}
  else if(!p.crouch){
    const a=(R?R.acc:ch.acc)*(onG||(R&&R.fly)?1:.8)*(p.liebre>0?2.2:1)*(L.th.ice&&onG?.4:1);
    if(keys.right){if(p.vx<0)p.vx+=onG?.75:.4;else if(p.vx<maxS)p.vx=Math.min(maxS,p.vx+a);p.face=1;}
    else if(keys.left){if(p.vx>0)p.vx-=onG?.75:.4;else if(p.vx>-maxS)p.vx=Math.max(-maxS,p.vx-a);p.face=-1;}
    else{const f=onG?(L.th.ice?.035:.3):.03;if(Math.abs(p.vx)<=f)p.vx=0;else p.vx-=Math.sign(p.vx)*f;}
    if(Math.abs(p.vx)>maxS&&onG&&p.dash<=0)p.vx-=Math.sign(p.vx)*.14;
  }
  p.skid=onG&&!p.roll&&((keys.right&&p.vx<-3)||(keys.left&&p.vx>3));
  if(p.skid&&L.t%3===0)L.parts.push({x:p.x+p.w/2,y:p.y+p.h-2,vx:-p.vx*.2,vy:-1,l:18,c:'#ddd',s:5});
  // salto
  if(pressed.jump&&!p.crouch)p.jbuf=8;else if(p.jbuf>0)p.jbuf--;
  if(onG){p.coyote=7;p.dbl=true;L.combo=0;}else if(p.coyote>0)p.coyote--;
  if(R&&R.fly){if(keys.jump||keys.up)p.vy-=.78;else p.vy+=.34;if(keys.down)p.vy+=.4;p.vy=clamp(p.vy,-6.5,6.5);if(p.y<36){p.y=36;p.vy=Math.max(0,p.vy);}if(L.t%4===0)L.parts.push({x:p.x+p.w/2-p.face*30,y:p.y+p.h-8,vx:-p.face*2,vy:rnd(0,1),l:16,c:'#ff9a1a',s:5});}
  else{
  const jv=(R?R.jump:ch.jump)*(p.ssj>0?1.15:1);
  if(L.th.underwater){if(pressed.jump){p.vy=-5.6;SFX.jump();L.parts.push({x:p.x+13,y:p.y,vx:0,vy:-1,l:40,c:'rgba(210,240,255,.85)',s:6});}}
  else if(p.jbuf>0&&p.coyote>0&&!p.crouch){p.vy=-(jv+Math.min(3,Math.abs(p.vx)*.2));p.coyote=0;p.jbuf=0;SFX.jump();}
  else if(pressed.jump&&(ch.dbl||(R&&R.dbl))&&!onG&&p.dbl&&p.coyote<=0){p.vy=-12;p.dbl=false;p.jbuf=0;SFX.jump();burst(p.x+p.w/2,p.y+p.h,'#fff',8);}
  if(!keys.jump&&p.vy<0&&p.springT<=0&&!L.th.underwater)p.vy+=.55;
  if(p.springT>0)p.springT--;
  if(L.th.underwater){p.vy+=.17;if(p.vy>3.4)p.vy=3.4;}else{p.vy+=.55;if(p.vy>14)p.vy=14;}}
  const wantH=R?R.h:(p.roll||p.crouch)?32:(p.big?58:46);
  if(p.h!==wantH){const ny=p.y+p.h-wantH;const tt=Math.floor(ny/T);let ok=true;if(wantH>p.h){for(let tx=Math.floor(p.x/T);tx<=Math.floor((p.x+p.w-1)/T);tx++)if(solid(tileAt(tx,tt)))ok=false;}
    if(ok){p.y=ny;p.h=wantH;}else{p.roll=true;if(Math.abs(p.vx)<2)p.vx=p.face*2;}}
  moveBody(p);
  if(p.hitHead)bumpBlock(p.hitHead.tx,p.hitHead.ty);
  checkLoop();
  // acelerador

  if(ft==='>'&&onG){p.vx=Math.max(p.vx,14.5);p.face=1;if(L.t%6===0)SFX.dash();}
  if(onG||p.roll)p.rot+=p.vx*.06;
  p.anim+=Math.abs(p.vx)*.22;

  for(const tr of L.trail)tr.l--;L.trail=L.trail.filter(tr=>tr.l>0);
  // vehículos
  for(const v of L.rides){if(v.gone||p.ride)continue;if(Math.abs(p.x+p.w/2-v.x)<30&&Math.abs(p.y+p.h-v.y)<60){v.gone=true;const RR=RIDES[v.type];p.ride={type:v.type,t:RR.time};p.big=p.big;SFX.power();ftext(p.x+13,p.y-30,'¡A '+(RR.fly?'VOLAR':'CORRER')+'!','#7affea');addScore(500);say(RR.say,{pitch:1.05});}}

    addScore(bonus,L.goal.x+30,p.y);L.flagY=L.goal.y-340;L.goalPhase='slide';p.x=L.goal.x-p.w+4;p.vx=0;p.vy=0;p.roll=false;if(p.ride)dismount(false);p.crouch=false;p.h=p.big?58:46;SFX.win();
  }

  const look=clamp(p.vx*16,-160,200);
  camUpdate(look);
  if(L.boss)L.camx=clamp(p.x-W/2,0,L.w-W);
  L.camy=20;
}
function goalSequence(){const p=L.p,g=L.goal;
  if(!g){return;}
  if(L.goalPhase==='slide'){p.y=Math.min(p.y+5,g.y-p.h);L.flagY=Math.min(L.flagY+5,g.y-70);if(p.y>=g.y-p.h&&L.flagY>=g.y-70){L.goalPhase='walk';p.face=1;}}
  else if(L.goalPhase==='walk'){p.vx=3.2;p.vy+=.55;moveBody(p);p.anim+=.7;if(p.x>g.x+250){L.goalPhase='in';L.doneT=0;}}
  else if(L.goalPhase==='in'){L.doneT++;if(L.doneT%3===0&&L.time>0){const s=Math.min(L.time,60*20);L.time-=s;L.score+=Math.floor(s/60)*10;if(L.doneT%6===0)beep(1500,.03,'square',.03);}
    if(L.doneT>70&&L.time<=0||L.doneT>140){L.goalPhase='end';levelComplete();}}
  const tx=clamp(p.x+p.w/2-W*.4,0,L.mainW-W);L.camx+=(tx-L.camx)*.1;
}

function updateFly(){
  const p=L.p,d=L.def;
  if(p.inv>0)p.inv--;
  const sp=L.done?0:d.speed;L.camx+=sp;p.x+=sp;
  if(!L.done){if(keys.right)p.x+=3;if(keys.left)p.x-=3;}
  p.x=clamp(p.x,L.camx+30,L.camx+W-320);
  if(!L.done){if(keys.jump||keys.up)p.vy-=.6;else p.vy+=.42;if(keys.down)p.vy+=.5;}else p.vy+=.1;
  p.vy=clamp(p.vy,-6.5,7);p.y+=p.vy;
  if(p.y<12){p.y=12;p.vy=0;}if(p.y>H-50){p.y=H-50;p.vy=-3;hurt(p.x+40);}
  p.anim+=.3;
  const hb={x:p.x+6,y:p.y+4,w:p.w-12,h:p.h-8};
  const x0=Math.floor(hb.x/T),x1=Math.floor((hb.x+hb.w)/T),y0=Math.floor(hb.y/T),y1=Math.floor((hb.y+hb.h)/T);

  if(d.fuel&&!L.done){L.fuel-=.075;if(L.fuel<=0){L.fuel=55;if(p.inv<=0){hurt(p.x);ftext(p.x+20,p.y-10,'¡Sin gasolina!','#ff6a6a');}else{p.hearts--;if(p.hearts<=0)gameOver();}}}
  if(L.goal&&!L.done&&p.x>L.goal.x){L.done=true;SFX.win();ftext(p.x,p.y-20,'¡LLEGAMOS!','#ffe066');}
  if(L.camx>L.w-W)L.camx=L.w-W;
}

function updateEnemy(e){
  const p=L.p;e.t++;
  if(e.dead){e.dt++;e.vy+=.5;e.y+=e.vy;e.x+=e.vx;return;}
  if(e.x<L.camx-300||e.x>L.camx+W+300){if(e.kind!=='flyer'&&e.kind!=='diver')return;}
  const dx=(p.x+p.w/2)-(e.x+e.w/2),dy=(p.y+p.h/2)-(e.y+e.h/2);
  switch(e.kind){
    case 'walker':{e.vy+=.55;if(e.vy>12)e.vy=12;e.vx=e.dir*(e.spec.speed||1)*(1+L.diff*.45);const front=e.dir>0?e.x+e.w+2:e.x-2;const below=tileAt(Math.floor(front/T),Math.floor((e.y+e.h+4)/T));
      moveBody(e);if(e.hitWall||(e.onGround&&!solid(below)&&below!=='='))e.dir=-e.dir;e.face=e.dir;if(e.y>ROWS*T+50){e.dead=true;e.dt=999;}break;}
    case 'charger':{e.vy+=.55;e.st--;
      if(e.state===0){e.vx=e.face*.6;if(Math.abs(dx)<330&&Math.abs(dy)<90&&e.st<=0){e.state=1;e.st=24;e.face=dx>0?1:-1;}}
      else if(e.state===1){e.vx=0;if(e.st<=0){e.state=2;e.st=70;}}
      else if(e.state===2){e.vx=e.face*6.2*(1+L.diff*.2);if(e.st<=0||e.hitWall){e.state=0;e.st=60;}}

function updateBoss(){
  const B=L.boss,bd=B.bd,p=L.p;B.st++;if(B.flash>0)B.flash--;

  else if(B.state==='walk'){B.face=dx>0?1:-1;B.vx=B.face*2.2*fast;if(B.st>(85/fast)){B.st=0;B.state=bd.attacks[Math.floor(Math.random()*bd.attacks.length)];}}

  }

let PEN=null;
const GL=300,GR=660,GT=170,GB=330;
function startPenalties(){
  PEN={turns:[{side:'them',name:'«El Telera»',look:'telera',script:'nubes'},{side:'us',name:'Saky',look:'saky'},{side:'them',name:'«El Aceitunero»',look:'maton'},{side:'us',name:'Vary',look:'vary'},{side:'them',name:'«El Pelusa»',look:'pelusa'},{side:'us',name:'Blacky',look:'blacky',tacon:true}],
    i:0,phase:'intro',t:0,us:[],them:[],ax:GL,ay:GT,adir:1,kz:1,kpick:-1,ball:null,res:'',extra:0,over:false,flash:0};
  mode='pen';setTouchVisible();
}
function penTurn(){return PEN.turns[PEN.i];}
function zoneOf(x){return x<420?0:x>540?2:1;}
function penAction(zone){
  if(!PEN)return;const tr=penTurn();if(!tr)return;
  if(tr.side==='us'){
    if(PEN.phase==='aimX'){PEN.phase='aimY';PEN.t=0;beep(700,.05,'square',.04);}
    else if(PEN.phase==='aimY'){PEN.target={x:PEN.ax,y:PEN.ay};PEN.kz=Math.floor(Math.random()*3);PEN.phase='fly';PEN.t=0;SFX.shoot();}
  }else if(PEN.phase==='keep'&&PEN.kpick<0){PEN.kpick=zone;penShootThem();}
}
function penShootThem(){const tr=penTurn();let z=Math.floor(Math.random()*3);let tx=[GL+60,480,GR-60][z]+rnd(-30,30),ty=rnd(GT+30,GB-30);
  if(tr.script==='nubes'){tx=480+rnd(-80,80);ty=-60;}
  PEN.target={x:tx,y:ty};PEN.shotZ=z;PEN.kz=PEN.kpick<0?1:PEN.kpick;PEN.phase='fly';PEN.t=0;SFX.shoot();}
function updatePenalties(){
  const P=PEN;P.t++;const tr=penTurn();
  if(P.phase==='intro'){if(P.t>70){P.phase=tr.side==='us'?'aimX':'keep';P.t=0;P.kpick=-1;P.ax=GL-30;P.ay=GT-20;}}
  else if(P.phase==='aimX'){P.ax+=P.adir*7.5;if(P.ax>GR+35){P.adir=-1;}if(P.ax<GL-35){P.adir=1;}}
  else if(P.phase==='aimY'){P.ay=GT-40+(Math.sin(P.t*.07-Math.PI/2)*.5+.5)*(GB-GT+40);}
  else if(P.phase==='keep'){if(P.t>110&&P.kpick<0){P.kpick=1;penShootThem();}}
  else if(P.phase==='fly'){if(P.t>=36){P.phase='res';P.t=0;
      let r;const tx=P.target.x,ty=P.target.y;
      if(tr.side==='us'){
        if(tx<GL+4||tx>GR-4||ty<GT+4){r='fuera';}
        else{const z=zoneOf(tx);if(z===P.kz&&Math.random()<(z===1?.8:.7))r='parada';else r='gol';}
        P.us.push(r==='gol');
      }else{
        if(tr.script==='nubes')r='nubes';
        else if(P.kz===P.shotZ&&Math.random()<.85)r='parada';else if(Math.random()<.1)r='fuera';else r='gol';
        P.them.push(r==='gol');
      }
      P.res=r;if(r==='gol'){tr.side==='us'?SFX.gol():SFX.hit();}else{tr.side==='us'?SFX.hit():SFX.gol();}
    }}
  else if(P.phase==='res'){if(P.t>110){
      P.i++;const ug=P.us.filter(Boolean).length,tg=P.them.filter(Boolean).length;
      if(P.i>=P.turns.length){
        if(P.us.length===P.them.length&&ug!==tg){penEnd(ug>tg);return;}
        if(P.us.length===P.them.length){const names=['Lily','Randy','Franky'];const k=P.extra++%3;P.turns.push({side:'them',name:'Matón del Cártel',look:'maton'},{side:'us',name:names[k],look:['lily','randy','franky'][k]});}
      }
      P.phase='intro';P.t=0;}}
  else if(P.phase==='end'){if(P.t===150){P.won?levelComplete():penLose();}}
}
function penEnd(won){PEN.phase='end';PEN.t=0;PEN.won=won;won?SFX.win():SFX.lose();}

const NARR={on:true,voice:null,busy:0};
try{const v=localStorage.getItem('zafios2_narr');if(v!==null)NARR.on=v==='1';}catch(e){}
function pickVoice(){try{if(!('speechSynthesis' in window))return;const vs=speechSynthesis.getVoices();NARR.voice=vs.find(v=>/^es[-_]ES/i.test(v.lang))||vs.find(v=>/^es/i.test(v.lang))||null;}catch(e){}}
if('speechSynthesis' in window){pickVoice();try{speechSynthesis.onvoiceschanged=pickVoice;}catch(e){}}
const capTTS=()=>window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.TextToSpeech;
function cleanSpeech(t){return t.replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}]/gu,'').replace(/[«»“”"]/g,'').replace(/—/g,', ').replace(/…/g,'... ').replace(/\s+/g,' ').trim();}
function htmlToText(h){const d=document.createElement('div');d.innerHTML=h;d.querySelectorAll('p,h2,div').forEach(n=>n.append(' . '));return d.textContent;}
function say(text,o){o=o||{};if(!NARR.on||!text)return;const t=cleanSpeech(text);if(!t)return;
  const now=performance.now();if(o.ifIdle&&now<NARR.busy)return;
  NARR.busy=now+t.length*62/(o.rate||1)+400;
  const cp=capTTS();
  if(cp){try{if(o.interrupt!==false)cp.stop().catch(()=>{});cp.speak({text:t,lang:'es-ES',rate:o.rate||1,pitch:o.pitch||1,volume:1,category:'playback'}).catch(()=>{});}catch(e){}return;}
  if(!('speechSynthesis' in window))return;
  try{if(o.interrupt!==false)speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';if(NARR.voice)u.voice=NARR.voice;u.rate=o.rate||1.02;u.pitch=o.pitch||1;speechSynthesis.speak(u);}catch(e){}
}
function hush(){NARR.busy=0;const cp=capTTS();if(cp){try{cp.stop().catch(()=>{});}catch(e){}}if('speechSynthesis' in window){try{speechSynthesis.cancel();}catch(e){}}}

  return {id,team,gk,x,y,hx:x,hy:y,f,vx:0,vy:0,face:team===0?1:-1,fx:team===0?1:-1,fy:0,spd:(ch?ch.spd*.42:3.2)+(gk?.2:0),look,bub:null,cool:0,stun:0,anim:0};}
function resetKick(team){const B=F.ball;B.x=FW/2;B.y=FH/2;B.vx=B.vy=B.z=B.vz=0;F.owner=null;F.state='kick';F.st=0;F.kickTeam=team;
  F.pl.forEach(p=>{p.x=p.hx+(p.team===0?-60:60)*(p.gk?0:1);p.y=p.hy;p.vx=p.vy=0;p.stun=0;});
  const k=F.pl.filter(p=>p.team===team&&!p.gk).sort((a,b)=>Math.abs(a.hy-FH/2)-Math.abs(b.hy-FH/2)+(b.f?b.f[0]:0)-(a.f?a.f[0]:0))[0];
  const hum=F.pl.find(p=>p.human);const kk=(hum.team===team&&!hum.gk)?hum:k;kk.x=FW/2-(team===0?16:-16);kk.y=FH/2;}
function insult(p,force){if(!force&&F.t-F.lastIns<80)return;F.lastIns=F.t;const own=INS_PJ[p.id]||[];const pool=Math.random()<.45&&own.length?own:INSULTOS;const txt=pool[Math.floor(Math.random()*pool.length)];p.bub={text:txt,t:150};
  say(txt,{pitch:pitchFor(PNAMES[p.id]==='Caballo'?'Caballo':PNAMES[p.id]),ifIdle:!force,interrupt:!!force});}
function kickBall(p,tx,ty,pow,lob){const B=F.ball;const dx=tx-B.x,dy=ty-B.y,m=Math.hypot(dx,dy)||1;B.vx=dx/m*pow;B.vy=dy/m*pow;B.vz=lob?6:2;F.owner=null;p.cool=24;SFX.shoot();}
function oppGoalX(team){return team===0?FW:0;}
function updateFutbol(){
  const B=F.ball;F.t++;F.st++;
  for(const p of F.pl){if(p.bub){p.bub.t--;if(p.bub.t<=0)p.bub=null;}if(p.cool>0)p.cool--;if(p.stun>0)p.stun--;}
  if(F.msg){F.msg.t--;if(F.msg.t<=0)F.msg=null;}
  if(F.state==='goal'){if(F.st>150){if(F.time<=0)endFutbol();else resetKick(F.lastConceded);}moveCam();return;}
  if(F.state==='end'){if(F.st===160)finishFutbol();moveCam();return;}
  if(F.state==='kick'){if(F.st>70){F.state='play';SFX.check();}}
  if(F.state==='play'){F.time--;if(F.time<=0){if(F.score[0]===F.score[1]&&!F.golden){F.golden=true;F.time=40*60;F.msg={text:'¡PRÓRROGA! ¡Gol de oro!',t:150};say('¡Prórroga! ¡Gol de oro!');}else{endFutbol();return;}}}
  // humano
  const me=F.me;
  if(F.state==='play'||F.state==='kick'){
    let ix=0,iy=0;if(JOY.on){ix=JOY.x;iy=JOY.y;}else{ix=(keys.right?1:0)-(keys.left?1:0);iy=(keys.down?1:0)-(keys.up?1:0);}
    const m=Math.hypot(ix,iy);if(m>1){ix/=m;iy/=m;}
    if(me.stun<=0&&F.state==='play'){me.vx=ix*me.spd*1.12;me.vy=iy*me.spd*1.12;}else{me.vx=me.vy=0;}
    if(m>.2){me.fx=ix/(m>1?1:Math.max(m,.01));me.fy=iy/(m>1?1:Math.max(m,.01));const n=Math.hypot(me.fx,me.fy)||1;me.fx/=n;me.fy/=n;me.face=me.fx>=0?1:-1;}
    if(F.state==='play'){
      if(pressed.jump){if(F.owner===me){const gx=oppGoalX(me.team),gy=FH/2+me.fy*90+rnd(-40,40);kickBall(me,gx,gy,15.5,false);if(Math.random()<.5)insult(me,true);}else tackle(me);}
      if(pressed.act){if(F.owner===me){const mates=F.pl.filter(q=>q.team===me.team&&q!==me&&!q.gk);let best=null,bs=-1e9;for(const q of mates){const dx=q.x-me.x,dy=q.y-me.y,d=Math.hypot(dx,dy);const sc=(dx*me.fx+dy*me.fy)/d*200-d*.3+(me.team===0?dx:-dx)*.2;if(sc>bs){bs=sc;best=q;}}if(best)kickBall(me,best.x+best.vx*12,best.y+best.vy*12,11.5,false);}else tackle(me);}
    }
  }
  // IA
  const ownerTeam=F.owner?F.owner.team:-1;
  for(const p of F.pl){if(p.human)continue;if(p.stun>0||F.state!=='play'){p.vx*=.8;p.vy*=.8;continue;}
    const dir=p.team===0?1:-1;
    if(p.gk){const gx=p.team===0?50:FW-50;const ty=clamp(B.y,FH/2-GOALH/2-10,FH/2+GOALH/2+10);steer(p,gx+(Math.abs(B.x-gx)<220?dir*30:0),ty,p.spd);
      if(!F.owner&&Math.hypot(B.x-p.x,B.y-p.y)<26&&Math.hypot(B.vx,B.vy)<14){F.owner=p;B.vx=B.vy=0;p.cool=40;}
      if(F.owner===p&&p.cool<=0){const t=F.pl.filter(q=>q.team===p.team&&!q.gk);const q=t[Math.floor(Math.random()*t.length)];kickBall(p,q.x,q.y,13,true);if(Math.random()<.3)insult(p);}
      continue;}
    if(F.owner===p){const gx=oppGoalX(p.team);const dGoal=Math.abs(gx-p.x);
      const near=F.pl.some(q=>q.team!==p.team&&Math.hypot(q.x-p.x,q.y-p.y)<46);
      if(dGoal<360&&p.cool<=0&&Math.random()<.04){kickBall(p,gx,FH/2+rnd(-GOALH/2+15,GOALH/2-15),15,false);if(Math.random()<.4)insult(p);}
      else if(near&&p.cool<=0&&Math.random()<.035){const t=F.pl.filter(q=>q.team===p.team&&q!==p&&!q.gk&&(q.x-p.x)*dir>-60);if(t.length){const q=t[Math.floor(Math.random()*t.length)];kickBall(p,q.x,q.y,11,false);}}
      else steer(p,gx,FH/2+Math.sin(F.t*.02+p.hy)*120,p.spd*.92);}
    else{const chaser=closestTo(p.team,B.x,B.y);
      if(ownerTeam!==p.team&&chaser===p){steer(p,B.x+B.vx*6,B.y+B.vy*6,p.spd);if(F.owner&&Math.hypot(F.owner.x-p.x,F.owner.y-p.y)<24&&Math.random()<.05)tackle(p);}
      else{const shift=(B.x-FW/2)*.55+(ownerTeam===p.team?dir*90:-dir*40);steer(p,clamp(p.hx+shift,40,FW-40),p.hy*.7+B.y*.3,p.spd*.8);}}
  }
  // movimiento
  for(const p of F.pl){p.x=clamp(p.x+p.vx,14,FW-14);p.y=clamp(p.y+p.vy,20,FH-10);if(Math.abs(p.vx)+Math.abs(p.vy)>.4){p.anim+=.5;if(!p.human)p.face=p.vx>=0?1:-1;}}
  // balón
  if(F.owner){const o=F.owner;const fx=o.human?o.fx:(o.team===0?1:-1),fy=o.human?o.fy:0;B.x=o.x+fx*16;B.y=o.y+fy*10+4;B.vx=o.vx;B.vy=o.vy;B.z=0;}
  else{B.x+=B.vx;B.y+=B.vy;B.vx*=.982;B.vy*=.982;B.vz-=.35;B.z=Math.max(0,B.z+B.vz);if(B.z===0&&B.vz<0)B.vz=Math.abs(B.vz)>2?-B.vz*.4:0;
    if(B.y<12){B.y=12;B.vy*=-.7;}if(B.y>FH-8){B.y=FH-8;B.vy*=-.7;}
    const inMouth=Math.abs(B.y-FH/2)<GOALH/2;
    if(B.x<0){if(inMouth&&B.z<40){goal(1);return;}B.x=4;B.vx*=-.6;}
    if(B.x>FW){if(inMouth&&B.z<40){goal(0);return;}B.x=FW-4;B.vx*=-.6;}
    // porteros paran
    for(const p of F.pl){if(!p.gk||p.human)continue;if(Math.hypot(B.x-p.x,B.y-p.y)<30&&Math.hypot(B.vx,B.vy)>=6){if(Math.random()<.55){B.vx*=-.5;B.vy=rnd(-5,5);SFX.bump();F.msg={text:'¡PARADÓN de '+PNAMES[p.id]+'!',t:80};if(Math.random()<.6)insult(p);}else{B.vx*=.9;}}}
    if(F.state==='play'){for(const p of F.pl){if(p.cool>0||p.stun>0)continue;if(Math.hypot(B.x-p.x,B.y+B.z*0-p.y)<20&&B.z<20&&Math.hypot(B.vx,B.vy)<13){F.owner=p;break;}}}
  }
  // insultos al azar
  if(F.state==='play'&&F.t%220===0){const near=F.pl.filter(p=>Math.hypot(p.x-B.x,p.y-B.y)<260);if(near.length)insult(near[Math.floor(Math.random()*near.length)]);}
  // árbitro
  F.ref.x+=(B.x-80-F.ref.x)*.02;F.ref.y+=(B.y+100-F.ref.y)*.02;
  moveCam();
}
function closestTo(team,x,y){let b=null,bd=1e9;for(const p of F.pl){if(p.team!==team||p.gk||p.human&&false)continue;const d=Math.hypot(p.x-x,p.y-y);if(d<bd){bd=d;b=p;}}return b;}
function steer(p,tx,ty,sp){const dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy);if(d<6){p.vx*=.6;p.vy*=.6;return;}p.vx=dx/d*Math.min(sp,d*.2);p.vy=dy/d*Math.min(sp,d*.2);}
function tackle(p){if(p.cool>0)return;p.cool=40;const o=F.owner;if(!o||o.team===p.team||Math.hypot(o.x-p.x,o.y-p.y)>34){p.vx+=p.face*3;return;}
  if(Math.random()<(o.gk?.25:.6)){F.owner=p;o.stun=40;SFX.stomp();F.parts.push({x:o.x,y:o.y-30,t:40,s:'💫'});insult(o,true);}
  else{p.stun=30;SFX.hit();F.parts.push({x:p.x,y:p.y-30,t:40,s:'💥'});F.msg={text:'¡Falta! Tarjeta amarilla pa '+PNAMES[p.id],t:90};insult(o,true);}}
function goal(team){F.score[team]++;F.state='goal';F.st=0;F.lastConceded=1-team;F.owner=null;const B=F.ball;B.vx=B.vy=0;
  const scorer=F.pl.filter(p=>p.team===team&&!p.gk).sort((a,b)=>Math.hypot(a.x-B.x,a.y-B.y)-Math.hypot(b.x-B.x,b.y-B.y))[0];
  F.msg={text:'¡¡GOOOOOL de '+TEAMS[team].short+'!!',t:150};team===F.myTeam?SFX.gol():SFX.lose();
  say('¡Gooool de '+TEAMS[team].name+'!',{interrupt:true});
  setTimeout(()=>{if(F&&scorer)insult(scorer,true);},900);
  const vic=F.pl.find(p=>p.team!==team&&p.gk);if(vic)setTimeout(()=>{if(F&&vic)insult(vic,false);},2600);
  if(F.golden){F.time=0;}
}
function endFutbol(){F.state='end';F.st=0;SFX.whistle?SFX.whistle():beep(2200,.6,'sine',.06);const w=F.score[F.myTeam]>F.score[1-F.myTeam];F.won=w;F.msg={text:w?'¡CAMPEONES DE LA VULGAR CUP!':(F.score[0]===F.score[1]?'Empate…':'Ha ganado el otro equipo…'),t:400};say(F.msg.text,{interrupt:true});}
function finishFutbol(){const won=F.won;const cb=F.onWin;setFutbolButtons(false);
  if(!cb){mode='menu';setTouchVisible();const res=F.score[F.myTeam]>F.score[1-F.myTeam]?'¡Has ganado!':F.score[0]===F.score[1]?'Empate':'Has perdido…';
    showOverlay(`<div class="card center"><h2 class="title">${res}</h2><p style="font-weight:900;font-size:20px">${TEAMS[0].short} ${F.score[0]} – ${F.score[1]} ${TEAMS[1].short}</p><button class="btn" id="r">🔁 Revancha</button><button class="btn alt" id="s">👥 Otro jugador</button><button class="btn alt" id="b">🏠 Menú</button></div>`,{r:()=>{hideOverlay();startFutbol(F.me.id,null);},s:()=>showFutbolSelect(null),b:showMenu});return;}
  if(won&&cb)cb();else if(!won){mode='menu';setTouchVisible();showOverlay(`<div class="card center"><h2 class="title">¡La concha…!</h2><p style="font-weight:800">${TEAMS[0].short} ${F.score[0]} – ${F.score[1]} ${TEAMS[1].short}. Hay que ganar para pasar.</p><button class="btn" id="r">🔁 Revancha</button><button class="btn alt" id="s">👥 Otro jugador</button><button class="btn alt" id="b">🗺️ Mundos</button></div>`,{r:()=>{hideOverlay();startFutbol(F.me.id,F.onWin);},s:()=>showFutbolSelect(F.onWin),b:showWorlds});}
  else{mode='menu';showMenu();}}
function moveCam(){const B=F.ball,m=F.me;const tx=m.x*.55+B.x*.45,ty=m.y*.55+B.y*.45;F.camx+=(clamp(tx-W/2,-40,FW-W+40)-F.camx)*.1;F.camy+=(clamp(ty-H/2+30,-60,FH-H+60)-F.camy)*.1;}

function renderFutbol(){

  for(const e of ents){
    if(e.ball){c.fillStyle='rgba(0,0,0,.3)';c.beginPath();c.ellipse(B.x,B.y+4,9,4,0,0,7);c.fill();c.fillStyle='#fff';c.beginPath();c.arc(B.x,B.y-B.z-3,8,0,7);c.fill();c.strokeStyle='#222';c.lineWidth=1.5;c.stroke();c.fillStyle='#222';c.beginPath();c.arc(B.x+Math.sin(F.t*.3)*2,B.y-B.z-3,3,0,7);c.fill();continue;}
    if(e.ref){c.fillStyle='rgba(0,0,0,.25)';c.beginPath();c.ellipse(F.ref.x,F.ref.y,14,5,0,0,7);c.fill();drawPerson(c,F.ref.x,F.ref.y,Object.assign({},LOOKS.muo,{shirt:'#111',jacket:null,scale:.85}),1,F.t,true);continue;}

    drawPerson(c,p.x,p.y,p.look,p.face,p.anim,Math.abs(p.vx)+Math.abs(p.vy)>.5);c.restore();
    if(p.human){c.fillStyle='#ffe066';c.beginPath();c.moveTo(p.x-8,p.y-74);c.lineTo(p.x+8,p.y-74);c.lineTo(p.x,p.y-64);c.fill();c.font='900 13px Nunito,Arial';c.textAlign='center';c.lineWidth=4;c.strokeStyle='#1a1238';c.strokeText('TÚ · '+PNAMES[p.id],p.x,p.y-80);c.fillStyle='#ffe066';c.fillText('TÚ · '+PNAMES[p.id],p.x,p.y-80);}

}

(function(){const pad=document.querySelector('#touch .l');const knob=document.createElement('div');knob.id='joy';knob.innerHTML='<i></i>';pad.appendChild(knob);
  const st=document.createElement('style');st.textContent='#joy{position:absolute;left:10px;bottom:0;width:170px;height:170px;border-radius:50%;border:4px solid rgba(0,0,0,.6);background:rgba(255,246,224,.35);display:none}#joy i{position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;background:rgba(255,200,58,.85);border:3px solid #000}';document.head.appendChild(st);
  const upd=e=>{if(mode!=='futbol')return;e.preventDefault();const r=knob.getBoundingClientRect();const cx=r.left+r.width/2,cy=r.top+r.height/2;let t=null;for(const tt of e.touches)if(tt.clientX<window.innerWidth*.5)t=tt;
    if(!t){JOY.on=false;JOY.x=JOY.y=0;knob.firstChild.style.transform='';return;}let dx=(t.clientX-cx)/60,dy=(t.clientY-cy)/60;const m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m;}JOY.on=true;JOY.x=dx;JOY.y=dy;knob.firstChild.style.transform=`translate(${dx*50}px,${dy*50}px)`;};
  ['touchstart','touchmove','touchend','touchcancel'].forEach(ev=>pad.addEventListener(ev,upd,{passive:false}));
})();

     {go:()=>{hush();showSelectDef(def);},back:()=>showWorld(w),nar:()=>say(htmlToText(lv.story))});

function playDef(def,charId){hideOverlay();CUR=def;loadDef(def,charId);mode='play';paused=false;setTouchVisible();checkRot();setActIcon();musicPlay(songFor(def));if(def.terror)say('Fase de terror… ¡Uuuuuh!',{pitch:.5,rate:.8});}

function stageClear(def,LL){
  const w=def.w,s=def.s;const W_=WORLDS[w-1];
  const sc=LL?LL.score:0;const key=w+'-'+(s===10?'M':(s+1));
  const prev=store.best[key]||{};store.best[key]={s:Math.max(sc,prev.s||0)};
  store.prog[w]=Math.max(progOf(w),s+1);save();
  mode='menu';setTouchVisible();
  if(s===10){worldClear(w,LL);return;}
  // ¿termina aquí un capítulo del libro?
  const ci=chapOf(w,s);const endHere=chapEnd(w,ci)===s&&!(W_.bossChap===undefined&&ci===W_.chap[W_.chap.length-1]);
  const endTxt=endHere?LEVELS[ci].end:'';
  const gem=LL&&LL.gotGem?'<p class="center" style="font-weight:900;color:#0a7a6a">💎 ¡Has conseguido la joya de esta fase!</p>':(LL&&def.mode==='plat'&&!(store.gems&&store.gems[def.id])?'<p class="center tiny">◇ La joya de esta fase sigue escondida… búscala otra vez.</p>':'');
  const stats=LL&&LL.grid?`<p class="center" style="font-weight:900;font-size:18px">⭐ ${sc} puntos${LL.ch?' · con '+LL.ch.name:''}</p>`:'';

   {nx:()=>openStage(w,nxt),q:()=>{const d=stageDef(w,nxt);const ci2=chapOf(w,nxt);if(chapStart(w,ci2)===nxt||d.mode!=='plat'||d.arch==='persecucion')openStage(w,nxt);else playDef(d,store.lastChar);},rp:()=>openStage(w,s),mw:()=>showWorld(w),nar:()=>say(htmlToText(endTxt))});
  if(endTxt)say('¡Fase superada! '+htmlToText(endTxt));
}

    const g=c.createRadialGradient(600,300,10,600,300,380);g.addColorStop(0,'rgba(150,60,200,.25)');g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.fillRect(0,0,W,H);}
  if(th.far==='nasa'){for(let i=Math.floor(camx*p1/520)-1;i<Math.floor(camx*p1/520)+4;i++){const x=i*520-camx*p1+200;c.fillStyle='#d8dce4';c.fillRect(x-14,200,28,230);c.beginPath();c.moveTo(x-14,200);c.lineTo(x,150);c.lineTo(x+14,200);c.fill();c.fillStyle='#e2362f';c.fillRect(x-14,250,28,10);c.fillStyle='#1d2a6a';c.font='900 11px Nunito';c.textAlign='center';c.fillText('NASA',x,300);c.fillStyle='#8a8f9a';c.fillRect(x+30,240,60,190);c.strokeStyle='#6a6f7a';c.lineWidth=2;for(let k=0;k<6;k++){c.beginPath();c.moveTo(x+30,250+k*30);c.lineTo(x+90,280+k*30);c.stroke();}}}
  if(th.far==='obras'){for(let i=Math.floor(camx*p1/300)-1;i<Math.floor(camx*p1/300)+5;i++){const x=i*300-camx*p1;c.fillStyle=th.farCol;c.fillRect(x,260+hash(i,53)*60,150,200);c.fillStyle='rgba(0,0,0,.18)';for(let k=0;k<4;k++)for(let j=0;j<3;j++)c.fillRect(x+15+j*45,280+hash(i,53)*60+k*40,22,24);
    c.strokeStyle='#e8b020';c.lineWidth=5;c.beginPath();c.moveTo(x+200,440);c.lineTo(x+200,150);c.lineTo(x+320,150);c.stroke();c.lineWidth=2;c.beginPath();c.moveTo(x+300,150);c.lineTo(x+300,200+Math.sin(t*.03+i)*10);c.stroke();}}
  if(th.far==='ibiza'){c.fillStyle='#1a8ad0';c.fillRect(0,330,W,110);c.fillStyle='rgba(255,255,255,.5)';for(let k=0;k<12;k++){c.fillRect(((k*97-camx*.1)%W+W)%W,350+(k%4)*18,30,2);}
    for(let i=Math.floor(camx*p1/240)-1;i<Math.floor(camx*p1/240)+6;i++){const x=i*240-camx*p1;c.fillStyle='#fff';c.fillRect(x,250+hash(i,54)*40,70,90);c.fillRect(x+60,280,50,60);c.fillStyle='#2a9ad8';c.fillRect(x+20,280+hash(i,54)*40,12,16);c.fillRect(x+75,300,10,14);
      c.strokeStyle='#6a4a2a';c.lineWidth=6;c.beginPath();c.moveTo(x+170,340);c.quadraticCurveTo(x+180,280,x+172,220);c.stroke();c.fillStyle='#2f9a4a';for(let k=0;k<5;k++){c.save();c.translate(x+172,220);c.rotate(k*1.25);c.beginPath();c.ellipse(22,0,24,6,0,0,7);c.fill();c.restore();}}
    c.fillStyle='#ff4fa3';c.font='900 30px "Luckiest Guy",Impact';c.textAlign='center';const px=((900-camx*.15)%2400+2400)%2400-200;c.fillText('🍒 PACHÁ 🍒',px,200);}
}
function drawFalcon(c,x,y,s){c.save();c.translate(x,y);c.scale(s,s);
  c.fillStyle='rgba(120,200,255,.25)';c.beginPath();c.ellipse(0,0,64,24,0,0,7);c.fill();
  const g=c.createLinearGradient(0,-22,0,22);g.addColorStop(0,'#e8ecf4');g.addColorStop(.5,'#8a92a6');g.addColorStop(1,'#4a5266');
  c.fillStyle=g;c.beginPath();c.ellipse(0,0,56,20,0,0,7);c.fill();c.strokeStyle='#1a1238';c.lineWidth=3;c.stroke();
  c.fillStyle='#05071a';c.beginPath();c.ellipse(0,0,34,9,0,0,7);c.fill();
  for(let k=0;k<10;k++){const a=k/10*6.283+(typeof L!=='undefined'&&L?L.t*.05:frame*.05);c.fillStyle=k%2?'#5ad8ff':'#ffe066';c.beginPath();c.arc(Math.cos(a)*45,Math.sin(a)*15,2.2,0,7);c.fill();}
  c.fillStyle='#e2362f';c.font='900 9px Nunito,Arial';c.textAlign='center';c.fillText('FALCON X',0,17);
  c.fillStyle='#ff8a1f';c.beginPath();c.moveTo(-54,-4);c.lineTo(-70-Math.random()*14,0);c.lineTo(-54,4);c.fill();
  c.restore();}
function drawRock(c,x,y,tx,ty){c.fillStyle='#5a4a5a';c.beginPath();c.arc(x+20,y+20,23,0,7);c.fill();c.fillStyle='#7a6a7a';c.beginPath();c.arc(x+14,y+14,11,0,7);c.fill();c.fillStyle='#3a2a3a';c.beginPath();c.arc(x+26+hash(tx,ty)*4,y+26,5,0,7);c.fill();}

  end:P2('Lily le restriega a Bóbetan el pañuelo de los mocos bordado con su revólver de plata. <i>«¡El método Ponzi es quedar siempre ponzima de cualquiera, maricón!»</i>. Blacky aprovecha y le escupe.','A Franky se le escapa delante de todos que el robo fue cosa del <b>Clan del Pelusa</b>. Torrente ya tiene lo que vino a buscar… pero Vary le quita las llaves del coche. La recompensa del rey: los tres primeros zafios de La Tierra a dedo, lingotes de oro de Mamazonia y mejoras para el reino.')+Q2('—¡Hágale pues! —sentenció el Capo.')},

        {look:'mariqui',name:'Mariqui',lines:['¡Ay, Bertín, qué guapo era!','Vete a freír espárragos... (en voz bajita)']},
        {look:'dorotea',name:'Doña Dorotea',lines:['¡Que he dicho que no, coñoo!','¡A mí el que me gustaba pa ustedes era el Fali!']},
        {look:'caballo',name:'Caballo',lines:['Te voy a decir una cosa que he escrito... *relincha*','Ya, ya, lo que tú digas...']},
        {look:'pacotilla',name:'Paco Tilla',lines:['¿Cuándo vamos a abrir? ¡Esto está ya listo, llamad al Tatino!']}],
  story:P2('En Cerealia, Randy ha traspasado el Pikolo Pub a <b>Los Pajaritas Fader</b>, que ahora resulta que están casados con las hijas de Doña Dorotea. Lo llamarán <b>«La Caseta de la Pradera»</b>, y las que mandan de verdad son ellas: <b>Vega y Mariqui</b>.',
    'Caballo ha despachado a Fali de una coz en la frente que le dejó las herraduras marcadas. Y anda con la mosca detrás de la oreja: ha visto a <b>Xavi y Ruly</b>, los del Very Vegui Pub, con probetas y una caja que pone «COVID TERRÁQUEO».'),
  end:P2('Doña Dorotea se va a Lavalandia a ver a «su» Fali, que está en la UCI. Las hermanas aprovechan: <i>«En este cuarto de mierda ya no vamos a dormir más»</i>.','Después de años ultra-mega protegidas, hacen las maletas. El disgusto que se va a llevar Doro a la vuelta será épico.')},
 {id:18,num:'Capítulo 18',title:'La fiesta de la Caseta de la Pradera',icon:'🎤',theme:'feria',plook:'romano',pname:'Romano Aspas',coin:'🎊',coinName:'papelillos',health:'🍹',rides:['quad','bus'],
  goal:{label:'La Caseta de la Pradera',emoji:'🎉'},
  en:{e:{kind:'walker',speed:1.2,skins:[{look:'pirata',name:'pirata con botellón',quotes:['¡Ron añejo pa todos!','¿Dónde está la rubia?'],die:'¡Hip!'},{look:'jubilado',name:'aldeano malleto',quotes:['¡Esto en mis tiempos no pasaba!']}]},
      E:{kind:'charger',skins:[{look:'bigkuki2',name:'Big Kuki celoso',quotes:['¡Me cago en todos tus muertos, ahora con este!']}]},
      T:{kind:'thrower',skins:[{look:'hijabruja',name:'camarera misteriosa',proj:'🥃',quotes:['Toma, bebe, que hoy te trinco.']},{look:'doro2',name:'Doña Dorotea',proj:'🥬',quotes:['¡Pedazo de malnacías, desagradecías!']}]},
      F:{kind:'flyer',skins:[{emoji:'🎈',size:34,name:'globo de la fiesta'}]}},
  npcs:[{look:'kukifuego',name:'Kuki Fuego',lines:['¡Espera, espera, monstruo! Esto lo presento yo y mi compadre Muo.']},
        {look:'chuky2',name:'Chus «Chuky» Lozano',lines:['Nosotros vamos a cantar a capela, en principio.','Mi tema se llama «Ahora o nunca».']},
        {look:'lusy2',name:'Lusy',lines:['¿Tú qué pasa, que no me vas a saludar nunca?','Hoy corte de caballero gratis.']},
        {look:'randy',name:'Randy',lines:['No veas, primo, cómo han dejado mi Pikolo estas dos.','¡Me cago en mis muertos, a caballo ahora también!']},
        {look:'alber2',name:'Alber Tito',lines:['Esto promete, tío, vaya cómo ha empezado la noche.','Que no metamos el hocico donde no nos llaman.']}],
  story:P2('Antes de la fiesta, <b>el Revivir de Randy</b>: una vez cada diez años, Randy entra en trance, se queda en pelotas y resucita a quien quiera durante un mes. En el Jardín de los Caídos grita un nombre… <b>«¡PAQUITOOOO!»</b>. El elegido aparecerá cuando Randy lo vuelva a gritar.',
    'Al día siguiente, Toño no para de cruzar invitados a Cerealia. La Caseta de la Pradera abre con carpa, bombillas de colores, <b>Romano Aspas</b> y <b>Chuky Lozano</b> recargados al sol, y un concurso que dará que hablar en el pueblo durante años.'),
  end:P2('Big Kuki ve a Lusy de la mano de su hermano <b>Medium</b> con un anillo, y le revienta una jarra de barro en la frente. Doña Dorotea entra por la ventana con la fusta y se monta la de Dios.','Y Randy, cotilleando en el cuarto de Mariqui, encuentra un papel firmado por Dorotea: él es <b>hijo de Dorotea y de Pompones</b>, abandonado en el orfanato. Hermanastro de las veganas. Al salir, Bóbetan le quita los grilletes al misterioso encapuchado: mañana tiene un papel importante.')},
 {id:16,num:'Capítulo 16',title:'Tensiones generales (Jubilandia)',icon:'👴',theme:'jubilandia',plook:'albertito',pname:'Alber Tito',coin:'💰',coinName:'pesetas',health:'🥪',rides:['bus','quad'],
  goal:{label:'Auditorio de Jubilandia',emoji:'🎪'},
  en:{e:{kind:'walker',speed:.9,skins:[{look:'jubilado',name:'jubileta rebelde',quotes:['¡Piter, sinvergüenza!','¡Ahí falta mezcla!','¡Que nos devuelvan la boda!'],die:'¡Ay, mi cadera!'},{look:'jubilada',name:'jubilada cabreada',quotes:['¡Con mi carnet de pensionista!']}]},
      E:{kind:'charger',skins:[{emoji:'🦽',size:44,name:'carrera de andadores',quotes:['¡Paso, que voy!']}]},
      T:{kind:'thrower',skins:[{look:'peseta',name:'El Peseta',proj:'🔧',quotes:['¡Con la llave esta le metía yo...!']},{look:'bastian',name:'Bastian «el viejo cangrenas»',proj:'🥖',quotes:['¡Rebelión contra Piter!']}]},
      F:{kind:'flyer',skins:[{emoji:'🕊️',size:32,name:'paloma de la plaza'}]}},
  npcs:[{look:'jacinto',name:'Jacinto',lines:['Este es un sinvergüenza dentro del marco de la legalidad.']},
        {look:'pedrito',name:'Pedrito (fichaje de Jubilandia)',lines:['¡Me mandaron a este maravilloso planeta, al que siempre he querido venir!','(Nadie aplaude.)']},
        {look:'piter',name:'Piter «El Chulo»',lines:['Ojú, esta juventud cómo está, cariño.','Ya nadie me aguanta en Jubilandia, pero yo sigo.']},
        {look:'trankas',name:'El Trankas',lines:['¡Ji, ji, ji! ¿Habéis visto a mi gordi?']}],
  story:P2('En <b>Jubilandia</b> no hay quien aguante a Piter «El Chulo» desde que dejó tirados a los jubilados en la boda real. Para que le perdonen, monta mítines con el fichaje del año, al que llaman «Pedrito el embustero».',
    'Pero <b>Bastian, «el viejo cangrenas»</b>, está calentando al personal. <b>El Peseta</b> no suelta su llave inglesa. Aquí va a haber rebelión.'),
  end:P2('El público abuchea el mitin. Jubilandia está que arde, y Piter, viendo el percal, se apunta al partido inaugural de la Vulgar Cup con la Totogordo y el Trankas.')},
 {id:162,num:'Capítulo 16 (II)',title:'Tensiones generales (Lavalandia)',icon:'👑',theme:'lavalandia',plook:'fali2',pname:'Fali «El Capullo»',coin:'🫐',coinName:'moritas del rey',health:'🍷',rides:['quad','hummer'],
  goal:{label:'Castillo de Lavalandia',emoji:'🏰'},
  en:{e:{kind:'walker',speed:1,skins:[{look:'guardia',name:'guardia real',quotes:['¡Alto! ¿De quién es usted?'],die:'¡Mi casco!'}]},
      E:{kind:'charger',skins:[{look:'connor',name:'Connor',quotes:['¡Patada a la nariz!','¡Bring it on!']}]},
      T:{kind:'thrower',skins:[{look:'banderas',name:'El Banderas',proj:'🍾',quotes:['Cava rosado Gran Buche, cosecha de 2020...']},{look:'narutoPal',name:'Antonio «Naruto»',proj:'⭐',quotes:['¡Deja a mi marido ya!']}]},
      F:{kind:'diver',skins:[{emoji:'🕊️',size:34,name:'paloma real'}]}},
  npcs:[{look:'grego',name:'Rey Grego I',lines:['¡Me tiene más agobiao que Doraemon en un cacheo!','Ya no me acuerdo ni de lo que les prometí...']},
        {look:'naruto',name:'Antonio «Naruto»',lines:['Parece un mono el guiri ese. Lo mandamos a Mamazonia.']},
        {look:'catalina',name:'Doña Catalina',lines:['¡Qué guapo eres, Capullito mío!']},
        {look:'fali2',name:'Fali «El Capullo»',lines:['¡A la orden!','Desde la coz de Caballo tengo media cara de platino.']}],
  story:P2('En la capital, el rey Grego está insoportable. Su nuevo guardaespaldas, <b>Connor</b>, se pasa el día lanzando patadas y amagos a su nariz, bebiendo y eructando detrás de él.',
    'Mientras tanto, <b>Fali «El Capullo»</b> se recupera en el castillo: la coz le ha dejado media cara de platino y ojos rojos como Terminator. Su enfermera particular es <b>Doña Catalina</b>. Y algo más: Catalina luce bombito.'),
  end:P2('Fali entra en la Guardia Real. El rey irá en persona al partido inaugural bajo palio, con banda de música y Catalina haciendo el saque de honor.','Y Juanka le ha prometido a Matilde que el rey encontrará a Pelito. <i>«¡Es una cuestión de Estado!»</i>')},
 {id:17,num:'Capítulo 17',title:'En tierra hostil',icon:'🦛',theme:'cartel',plook:'pelito',pname:'Pelito Meado',coin:'🪶',coinName:'plumas del penacho',health:'🍌',rides:['barca','quad'],
  goal:{label:'Hacienda Nápoles',emoji:'💉'},
  en:{e:{kind:'walker',speed:1.3,skins:[{look:'maton',name:'maleante del Clan',quotes:['¡Información o plomo!','¿Tú vienes a robarnos opio?'],die:'¡Ay, mi madre!'},{look:'coto',name:'Coto Matamoros',quotes:['Ya tenemos fichajazo y mascota.']}]},
      E:{kind:'charger',skins:[{emoji:'🦛',size:52,name:'hipopótamo de la Hacienda',quotes:['¡BRRROOOM!']}]},
      T:{kind:'thrower',skins:[{look:'telera',name:'El Telera',proj:'🍾',quotes:['¡Métete un chute aquí con nosotros, Peli!']},{look:'chapo',name:'El Chapo',proj:'💨',quotes:['¡Te crees potranca desbocada!']}]},
      F:{kind:'diver',skins:[{emoji:'🦩',size:38,name:'flamenco de la charca'},{emoji:'🦟',size:30,name:'bicho atraído por el pis'}]},
      j:{kind:'jumper',skins:[{emoji:'🐊',size:40,name:'caimán'}]}},
  npcs:[{look:'frank',name:'Frank «De la Jungla»',lines:['¡Te cacé! Aquí no queremos intrusos.','Yo vacuno hipopótamos... y paso información, pero eso no lo digas.']},
        {look:'cesar',name:'César, el de los pollos',lines:['Yo seré de todo, picha, pero chivato no soy.']},
        {look:'pelusa2',name:'El Pelusa',lines:['Ponle un cencerro para que no se escape.','¡Leandro Gado, fichaje estrella!']},
        {look:'leandro',name:'Leandro Gado (el Monito)',lines:['Este sitio me gusta. Me siento como en casa.','Me faltaban seis meses para la condicional...']}],
  story:P2('<b>Pelito Meado</b> fue abandonado por Xavi y Ruly en los algodonales de Cerealia, cruzó a nado el canal de Chaneka con un caimán detrás… y se meó encima. Los bichos le picoteaban el penacho de plumas.',
    'Tres kilómetros después, bajo un pórtico con forma de jeringas, lo pilló la patrulla del <b>Clan del Pelusa</b>. Le pusieron un cencerro de preso y a <b>La Catedral</b> a pan y agua. Ahora toca escapar por la charca de la <b>Hacienda Nápoles</b>.'),
  end:P2('En la Hacienda hay fiesta rociera: aparece un fugado de Cerealia, al que el Pelusa conoce de La Tierra. Le operan las orejas y lo rebautizan como <b>Leandro Gado</b>.','Y a Pelito le dan un nuevo puesto: será <b>«Cojoncito»</b>, la mascota del equipo en la Vulgar Cup. Un disfraz horrible de dos testículos pelones con ojos.')},
 {id:19,num:'Capítulo 19',title:'La previa',icon:'🚌',theme:'catedral',plook:'blacky',pname:'Blacky, portero',coin:'⚽',coinName:'balones',health:'🥤',rides:['bus','hummer'],
  goal:{label:'Estadio de La Catedral',emoji:'🏟️'},
  en:{e:{kind:'walker',speed:1.3,skins:[{look:'maton',name:'ultra sobornado',quotes:['¡Fuera los primos!','¡Pelusa, Pelusa!'],die:'¡Penalti!'}]},
      E:{kind:'charger',skins:[{emoji:'🐅',size:50,name:'el tigre de la Hacienda',quotes:['¡GRRRAAAH!']}]},
      T:{kind:'thrower',skins:[{look:'echenike',name:'Echenike en la torre',proj:'🪨',quotes:['¡Ahí va otra!']},{look:'catedrales',name:'Pablito Catedrales',proj:'💨',quotes:['¡Bote de humo!']}]},
      F:{kind:'diver',skins:[{emoji:'🎆',size:34,name:'bengala'}]}},
  npcs:[{look:'mourino',name:'Mouriño',lines:['¡Salid del bus y corred al vestuario!','Blacky de portero, que es el más alto.']},
        {look:'patito',name:'Patito',lines:['Yo fui el que te empujó a la marmita de manteca colorá, je, je.']},
        {look:'curro',name:'Nieto de Curro Jiménez',lines:['Son órdenes del jefe. La entrada, por la voluntad.']},
        {look:'muo2',name:'El Muo, árbitro',lines:['¿Al Comando le falta uno o qué?','Que yo solo me he bebío dos copitas, ¿eh?']},
        {look:'putyn',name:'Vladimir Putyn',lines:['Beba, señor, beba agua y cálmese.','Lleva un chorreón de cóctel ruso, je, je.']}],
  story:P2('Sábado: partido inaugural de la <b>Vulgar Cup</b> en el estadio de La Catedral, dentro de la Hacienda Nápoles. Vary no viene (dice que tiene una carrera popular) y Franky sigue en Ibiza. Entran <b>Patito</b> (el que empujó a Randy a la marmita) y <b>Pikito Rubiales</b>, con la Yeny de masajista.',
    'Nada más cruzar el pórtico de las jeringas llueven pedruscos sobre el bus de Mouriño. Echenike desde la torre de vigía, el Chapo y Pablito Catedrales con botes de humo. Hay que llegar al vestuario.'),
  end:P2('El rey llega bajo palio. Catalina, de medio metro y con bombito, hace el saque de honor. Shaky intenta cantar y el banquillo del Clan le canta <i>«¡Piqué, Piqué!»</i>: sale corriendo y se esconde en la cabaña de Frank.','El Muo cuenta a los jugadores. Al Comando le falta uno. <i>«¡Ahora viene, pita ya!»</i>, dice Randy sonriendo.')},
 {id:20,num:'Capítulo 20',title:'La jugada',icon:'⚽',theme:'catedral',plook:'randy',pname:'Randy «Manteka»',coin:'⚽',coinName:'balones',health:'🥤',rides:['falcon','bus'],
  goal:{label:'Portería del Clan',emoji:'🥅'},
  en:{e:{kind:'walker',speed:1.3,skins:[{look:'telera',name:'El Telera',quotes:['¡Botellazo!'],die:'¡Me mareo!'},{look:'coto',name:'Coto Matamoros',quotes:['¡Dejad al Pelito!']}]},
      E:{kind:'charger',skins:[{look:'leandro',name:'Leandro Gado',quotes:['¡Entrada en plancha!']}]},
      T:{kind:'thrower',skins:[{look:'pelusa2',name:'El Pelusa',proj:'⚽',quotes:['¡Toma balonazo, boludo!']}]},
      F:{kind:'flyer',skins:[{emoji:'🍾',size:30,name:'botella voladora'}]}},
  npcs:[{look:'kampy',name:'Kampy',lines:['¡Tú, tú eres el que buscamos! Vente con tu madre.']},
        {look:'pelito',name:'Pelito (sin disfraz)',lines:['¡Mamá! ¡Mamá Matilde!']},
        {look:'lily',name:'Capo Lily',lines:['Es la hora, carnes. ¡Hazlo, primo!','¡Ahí lo lleváis! ¡Este es nuestro jugador número once!']},
        {look:'lara',name:'Comandante Lara',lines:['¡Es el Falcon, ja, ja!']}],
  story:P2('Minuto diez. Los legionarios le quitan el disfraz a la mascota y Rano compara con su retrato robot: <b>¡Es Pelito!</b> El Clan no se lo quiere dejar llevar. El Muo para el partido y <b>Vladimir</b> sale corriendo con las botellas de agua: <i>«Pausa de hidratación»</i>.',
    'Se arma la tangana del siglo delante del rey. Lily y Randy, tranquilos en el córner más lejano. Todo va según lo planeado.'),
  end:P2('Randy se desnuda, abre los brazos en cruz, entra en trance y grita: <b>«¡¡¡PAQUITOOOOO!!!»</b>. Una sombra gigante cubre el estadio: el <b>Falcon X</b>, pilotado por De la Momi, con un copiloto de bigotito cano y una ley de vagos y maleantes bajo el brazo.','Del Falcon bajan en rápel veinte rapados, y detrás <b>Vary</b>, que no tenía ninguna carrera. Los piratas de Big Kuki entran gritando como vikingos. El Clan, envenenado y sin memoria, acaba entre rejas en La Catedral.')},
 {id:21,num:'Capítulo 21',title:'Evasión y victoria',icon:'💎',theme:'cartel',plook:'vary',pname:'Vary, cerrajero',coin:'💍',coinName:'anillos del rey',health:'🍷',rides:['falcon','quad'],
  goal:{label:'Falcon X',emoji:'🛸'},
  en:{e:{kind:'walker',speed:1.2,skins:[{look:'guardia',name:'guardia real',quotes:['¡Alto en nombre del rey!'],die:'¡Mi lanza!'}]},
      E:{kind:'charger',skins:[{look:'narutoPal',name:'Antonio «Naruto»',quotes:['¡Hijos de puta, la coronaaa!','¡No escapéis!']}]},
      T:{kind:'thrower',skins:[{look:'fali2',name:'Fali, Guardia Real',proj:'🏹',quotes:['¡A la orden!']}]},
      F:{kind:'diver',skins:[{emoji:'🦅',size:38,name:'águila de la Hacienda'}]}},
  npcs:[{look:'torrente',name:'Torrente',lines:['¡Llamad a Gregorio primero de Lavalandia! ¡Hemos encontrado sus joyas!']},
        {look:'momi',name:'De la Momi',lines:['El depósito lo tengo lleno, gloria bendita. ¿A dónde vamos?']},
        {look:'romano',name:'Romano Aspas',lines:['¿Habéis dicho Ibiza? ¡Vidaaaa!']},
        {look:'catalina',name:'Doña Catalina',lines:['¡Otra vez me abandonas, Pelito!']}],
  story:P2('Vary abre el portón de caoba de la Hacienda con un trocito de radiografía. Arriba, junto al dormitorio del Pelusa, está el cuarto de los <b>«Objetos perdidos»</b>. El de los rapados tira la puerta de una patada.',
    'Bajo una manta del Barça está el cofre. Torrente lo destapa y se queda con la boca abierta: ahí están las joyas del rey… pero de la corona, ni rastro. Normal: la tiene Estresy Brenes en el dormitorio del Capo. Si el rey se da cuenta, todos a la mazmorra.'),
  end:P2('<i>«¡Hijos de puta, la coronaaaa!»</i>, grita Naruto corriendo como un dóberman. Lanzas y flechas contra el Falcon. <i>«¡A Ibiza!»</i>, propone Torrente. Romano se cuela por la compuerta en el último segundo.','Y a Pelito, desde la ventanilla, se le escapa un «te quiero» para Catalina.')},
 {id:22,num:'Capítulo 22',title:'Reencuentro y festejo',icon:'🍒',theme:'ibiza',plook:'franky',pname:'Franky, el del Tren',coin:'🍒',coinName:'cerezas de Pachá',health:'🍹',rides:['tren','falcon'],
  goal:{label:'La cala del Falcon X',emoji:'🛸'},
  en:{e:{kind:'walker',speed:1.3,skins:[{look:'camarero',name:'guiri de fiesta',quotes:['¡Ibiza, baby!','Where is the party?'],die:'¡Oh my God!'},{look:'guardia',name:'vigilante de Pachá',quotes:['¡Esa pulsera no es VIP!']}]},
      E:{kind:'charger',skins:[{emoji:'🚓',size:52,name:'«zeta» de la Policía',quotes:['¡Alto, policía!']}]},
      T:{kind:'thrower',skins:[{look:'julito',name:'Julito',proj:'🎙️',quotes:['Y eso lo sabes tú.']},{look:'guetta',name:'el DJ',proj:'💿',quotes:['¡Manos arriba!']}]},
      F:{kind:'flyer',skins:[{emoji:'🪩',size:34,name:'bola de discoteca'}]}},
  npcs:[{look:'ara',name:'La prima Ara',lines:['Esta noche estáis en la zona VIP de Los Gramófonos Latinos. Todo pagado.','¡Rápido, que ha llamado Dirección a la Policía!']},
        {look:'franky',name:'Franky',lines:['Me gustaría quedarme en La Tierra con María, haciendo colaboraciones...','¡Esperadme, que me despido de ella!']},
        {look:'becerra',name:'María Becerra',lines:['Ahora mismo tú eres el único gallo de mi corral.','¿Era el alcohol o qué?']},
        {look:'saky',name:'Saky',lines:['¿Tú qué le hablas a esa muchacha, primo?','Hoy es sábado: llegamos a la hora buena.']},
        {look:'torrente',name:'Torrente',lines:['Yo me quedo en mi isla. Cuidad de mis tres hombres.']}],
  story:P2('El Falcon sobrevuela Madrid y alguien se acuerda: <i>«¿Dónde vamos nosotros de fiesta con este?»</i>. Le ponen al copiloto un paracaídas con GPS rumbo a El Pardo y Lily le da una patada: cae sobre Las Ventas.',
    'En una cala de Ibiza les espera la <b>prima Ara</b> con el <b>Tren de la Alegría</b>. Esta noche, en Pachá, se celebran <b>Los Gramófonos Latinos</b>, los premios a lo peor de la música en español. Y Franky está enchochado de la nominada a peor actuación: <b>María Becerra</b>.'),
  end:P2('Romano se sube al escenario, le quita el micro a María y canta «Cleopatra». Llaman a la Policía. Torrente saca el revólver: <i>«¡Plan B!»</i>. Moñas y Beronia sacan a María por la puerta de emergencia y Bóbetan arrastra a Franky.','Huida a 33 por hora por las callejuelas. Romano corre detrás del tren, se sobrecalienta y sus baterías hacen cortocircuito. <i>«¡Vidaaaa!»</i>. Descanse en paz. Torrente se queda en la isla. Rumbo a casa, Lily bautiza la misión: <b>«Amiguetes on paradise»</b>, porque con vosotros me siento en el paraíso.')}
];

const EPILOGO2=P2('Domingo al amanecer. El Falcon aterriza en la frontera de Mamazonia. <b>Arturico</b>, el canguro, sale botando a avisar. <i>«¡Por fin, mi retoño!»</i>, llora Matilde al ver a <b>Pelito</b> hecho un hombrecito.',
  '<b>Bóbetan, Moñas y Beronia</b> entran en el Comando (tras un cursillo con la Patrulla Malina). <b>Shaky</b> se queda en la cabaña de Frank componiendo maldades. <b>Paquito</b> sigue su mes de vida en La Tierra intentando poner orden, pero lo tiene difícil.',
  '<b>Piter, la Totogordo, el Trankas y Doña Dorotea</b> se van de vacaciones cerca de la Isla de los Endebles. <b>Xavi y Ruly</b> queman el laboratorio clandestino y reclaman al seguro. <b>Caballo</b> pasea solo por los carriles: ha aborrecido las alcachofas y ahora es carnívoro.',
  '<b>Big Kuki y Lusy</b> se casarán en la cima del Monte Anacardo, con Medium de padrino y los Sanguinarios del Mar tatuados: «Barcos de madera, hombres de acero». <b>Connor</b> pasa a ser entrenador personal de Catalina y <b>Fali</b> ocupa su puesto.',

function meleeHit(p,w,emoji){p.cool=22;p.swing=14;p.swingE=emoji;SFX.shoot();const r={x:p.face>0?p.x+p.w-4:p.x-w+4,y:p.y-6,w,h:p.h+6};
  for(const e of L.enemies)if(!e.dead&&ov(r,e))killEnemy(e);if(L.boss&&!L.boss.calm&&ov(r,L.boss))hitBoss();
  const x0=Math.floor(r.x/T),x1=Math.floor((r.x+r.w)/T),y0=Math.floor(r.y/T),y1=Math.floor((r.y+r.h-1)/T);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)if(tileAt(tx,ty)==='K')breakBrick(tx,ty);}
function areaHit(p,rad,txt,col,cool,emoji){p.cool=cool;L.shake=12;SFX.hit();ftext(p.x+13,p.y-30,txt,col);
  for(const e of L.enemies)if(!e.dead&&Math.hypot(e.x-p.x,e.y-p.y)<rad)killEnemy(e);
  if(L.boss&&!L.boss.calm&&Math.hypot(L.boss.x+L.boss.w/2-p.x,L.boss.y+L.boss.h/2-p.y)<rad+40)hitBoss();
  for(let i=0;i<16;i++){const a=i/16*6.28;L.parts.push({x:p.x+13,y:p.y+20,vx:Math.cos(a)*6,vy:Math.sin(a)*6,l:28,c:col,s:6,emo:emoji&&i%4===0?emoji:null});}}

function bossEvent2(){const B=L.boss;if(!B)return;
  if(B.bd.paquito&&!B.paq&&B.hp<=Math.ceil(B.maxhp/2)&&!B.calm){B.paq=1;L.paq={t:0};L.freeze=0;say('¡¡¡Paquitoooo!!!',{pitch:.85,interrupt:true});SFX.ssj();}
  if(L.paq){L.paq.t++;const t=L.paq.t;
    if(t===150){for(let k=0;k<5;k++)L.eproj=[];for(let k=0;k<4;k++)L.parts.push({x:L.camx+200+k*150,y:-20,vx:0,vy:4,l:120,c:'#fff',s:2,emo:'💂'});}
    if(t===200||t===215||t===230){B.flash=0;hitBoss();L.shake=14;}
    if(t>320)L.paq=null;}}

  if(B.state==='intro'&&!B.calm){const k=Math.min(1,B.st/18),out=B.st>95?(B.st-95)/15:0;c.save();c.globalAlpha=1-out;

function mkFighter(id,team,x,opt){const F=FIGHTERS[id];opt=opt||{};const hp=Math.round((F.hp||100)*(opt.hpMul||1));
  return {id,F,team,x,y:GY,vx:0,vy:0,face:team===0?1:-1,hp,maxhp:hp,st:'idle',t:0,atk:null,stun:0,meter:opt.meter||0,combo:0,comboT:99,ko:false,kot:0,bub:null,inv:0,human:!!opt.human,blk:false,ai:{t:0,act:'idle',lvl:opt.lvl||.5},flash:0,scale:opt.scale||1.75,respawn:opt.respawn||false,anim:0,hitT:0};}

function startLucha(o){
  // o: {kind:'duel'|'royale', me, rival, theme, onWin, onLose, ladder}
  const th=THEMES[o.theme]||THEMES.catedral;
  LU={o,kind:o.kind||'duel',th:themeFor(th,'normal',false),t:0,fs:[],proj:[],parts:[],texts:[],shake:0,phase:'intro',pt:0,round:1,wins:[0,0],time:60*60,slow:0,kills:0,toKill:0,paq:null,queue:[],ladderI:o.ladderI||0};
  const me=mkFighter(o.me,0,200,{human:true});LU.me=me;LU.fs.push(me);
  if(LU.kind==='duel'){LU.rival=mkFighter(o.rival,1,W-200,{lvl:o.lvl||.55,hpMul:o.hpMul||1});LU.fs.push(LU.rival);}
  else{const allies=['lily','randy','vary','blacky','saky','torrente','bobetan','kampy','bigkuki'].filter(a=>a!==o.me).slice(0,3);
    allies.forEach((a,i)=>LU.fs.push(mkFighter(a,0,90+i*70,{lvl:.55,respawn:true,scale:1.55})));
    LU.queue=['telera','pelusa','patito','telera','pelusa','patito','telera','patito','pelusa','telera','patito','pelusa','telera','patito','pelusa','telera','patito','pelusa'].map((id,i)=>({id:i%5===4?'pelusa':id,look:['telera','coto','chapo','catedrales','monoburgos','dinio','aceitunero','cono','magic','leandro','sanfrancisco','echenike','cesar','curro','telera','coto','patito','pelusa2'][i]}));
    LU.toKill=LU.queue.length;}
  hideOverlay();const ba=document.getElementById('bAct');if(ba){ba.textContent='👊';ba.style.visibility='visible';}mode='lucha';paused=false;setTouchVisible();musicStop();musicPlay('boss');
  say(LU.kind==='duel'?'¡Ronda uno! ¡Pelea!':'¡La gran tangana del siglo! ¡Todos contra todos!',{interrupt:true,pitch:.9});
}
function luSpawn(){if(LU.kind!=='royale'||!LU.queue.length)return;const alive=LU.fs.filter(f=>f.team===1&&!f.ko).length;if(alive>=4)return;
  const q=LU.queue.shift();const side=Math.random()<.5;const f=mkFighter(q.id,1,side?-40:W+40,{lvl:.4+Math.random()*.3,scale:1.55,hpMul:.55});
  if(q.look&&q.look!==FIGHTERS[q.id].look){f.lookOv=q.look;}f.face=side?1:-1;f.vx=side?3:-3;LU.fs.push(f);}

function luTarget(f){let best=null,bd=1e9;for(const g of LU.fs){if(g.team===f.team||g.ko)continue;const d=Math.abs(g.x-f.x)+(g.human?-60:0);if(d<bd){bd=d;best=g;}}return best;}
function luAttack(f,kind){if(f.atk||f.stun>0||f.ko)return;
  if(kind==='sp'){if(f.meter<100)return;f.meter=0;f.atk={k:'sp',t:0,dur:f.F.sp.k==='dash'?30:24,hit:{}};luText(f.x,f.y-150,f.F.sp.n,'#ffe066');say(f.F.sp.n,{ifIdle:!f.human,interrupt:f.human,pitch:pitchFor(f.F.n)});SFX.power();LU.shake=6;
    if(f.F.sp.k==='dash'){f.vx=f.face*15;}if(f.F.sp.k==='area'){LU.shake=14;}return;}
  if(f.y<GY-2){f.atk={k:'air',t:0,dur:20,hit:{}};SFX.shoot();return;}
  f.combo=(f.comboT<30)?(f.combo+1)%3:0;f.comboT=0;
  f.atk={k:f.combo===2?'kick':'punch',t:0,dur:f.combo===2?22:15,hit:{}};SFX.jump();}
function luHit(att,def,dmg,kb,stun){if(def.ko||def.inv>0)return;
  const blocking=def.blk&&def.y>=GY-2&&Math.sign(att.x-def.x)===def.face;
  if(blocking){dmg*=.15;kb*=.4;stun=6;luPart(def.x+def.face*20,def.y-70,'🛡️');beep(300,.06,'square',.05);}
  else{luPart((att.x+def.x)/2,def.y-80,'💥');SFX.stomp();def.flash=8;}
  def.hp=Math.max(0,def.hp-dmg);def.vx=Math.sign(def.x-att.x||1)*kb;def.stun=stun;def.atk=null;def.meter=Math.min(100,def.meter+5);att.meter=Math.min(100,att.meter+9);LU.shake=Math.max(LU.shake,blocking?2:6);
  if(def.hp<=0)luKO(def,att);
  else if(!blocking&&Math.random()<.18)luSay(def,(INSULTOS[Math.floor(Math.random()*INSULTOS.length)]));}
function luKO(f,by){f.ko=true;f.kot=0;f.vy=-11;f.vx=Math.sign(f.x-by.x||1)*7;f.atk=null;SFX.die();LU.shake=12;luText(f.x,f.y-150,'K.O.','#ff5a5a');
  if(f.team===1&&LU.kind==='royale'){LU.kills++;if(Math.random()<.35)LU.parts.push({x:f.x,y:GY-20,vx:0,vy:-4,l:400,emo:'🍺',heal:true,s:0});}
  if(LU.kind==='duel'){LU.slow=70;LU.phase='ko';LU.pt=0;LU.wins[by.team]++;say('¡K.O.!',{interrupt:true,pitch:.7});}}
function luSay(f,txt){f.bub={text:txt,t:120};say(txt,{pitch:pitchFor(f.F.n),ifIdle:true,interrupt:false});}
function luText(x,y,s,c){LU.texts.push({x,y,s,c,l:70});}
function luPart(x,y,e){LU.parts.push({x,y,vx:rnd(-1,1),vy:-1,l:22,emo:e,s:0});}

function luControl(f){
  if(f.human){const k=keys;f.blk=k.down;
    if(!f.blk&&f.stun<=0&&!f.atk){if(k.left){f.vx=-f.F.spd;}else if(k.right){f.vx=f.F.spd;}else f.vx*=.6;}
    if(pressed.jump&&f.y>=GY-1&&f.stun<=0&&!f.blk){f.vy=-15.5;SFX.jump();}
    if(keys.sp&&!LU.spPrev)luAttack(f,'sp');LU.spPrev=keys.sp;
    if(pressed.act){if(keys.down&&f.meter>=100)luAttack(f,'sp');else luAttack(f,'n');}
    const tg=luTarget(f);if(tg&&!f.atk)f.face=tg.x>f.x?1:-1;return;}
  const A=f.ai,tg=luTarget(f);if(!tg){f.vx*=.8;return;}
  f.face=tg.x>f.x?1:-1;const d=Math.abs(tg.x-f.x);A.t--;
  if(A.t<=0){A.t=8+Math.random()*(22-A.lvl*12);const r=Math.random();
    if(f.meter>=100&&(f.F.sp.k==='proj'?d>160:d<170)&&r<.5+A.lvl*.3)A.act='sp';
    else if(d>80)A.act=r<.12?'jump':'approach';
    else A.act=tg.atk&&r<.2+A.lvl*.35?'block':r<.55+A.lvl*.3?'attack':r<.8?'back':'idle';}
  f.blk=A.act==='block';
  if(f.stun>0||f.atk)return;
  switch(A.act){case 'approach':f.vx=f.face*f.F.spd*.85;break;case 'back':f.vx=-f.face*f.F.spd*.6;break;
    case 'jump':if(f.y>=GY-1){f.vy=-15;f.vx=f.face*f.F.spd;}A.act='approach';break;
    case 'attack':f.vx*=.5;luAttack(f,'n');break;case 'sp':luAttack(f,'sp');A.act='idle';break;default:f.vx*=.7;}
  if(Math.random()<.004)luSay(f,f.F.q[Math.floor(Math.random()*f.F.q.length)]);}

function luStep(f){
  if(f.bub){f.bub.t--;if(f.bub.t<=0)f.bub=null;}if(f.flash>0)f.flash--;if(f.inv>0)f.inv--;f.comboT++;
  if(f.ko){f.kot++;f.vy+=.7;f.y+=f.vy;f.x+=f.vx;f.vx*=.95;if(f.y>GY){f.y=GY;f.vy=0;f.vx*=.7;}
    if(f.respawn&&f.kot>240){f.ko=false;f.hp=Math.round(f.maxhp*.6);f.inv=90;luSay(f,'¡Me levanto, que esto no se queda así!');}
    return;}
  if(f.stun>0)f.stun--;
  if(LU.phase==='fight'&&!f.human||f.human&&LU.phase==='fight')luControl(f);
  // ataque en curso
  if(f.atk){const a=f.atk;a.t++;
    const act=a.k==='punch'?(a.t>=4&&a.t<=8):a.k==='kick'?(a.t>=6&&a.t<=12):a.k==='air'?(a.t>=3&&a.t<=16):(a.t>=6&&a.t<=a.dur-4);
    if(a.k==='sp'){const s=f.F.sp;
      if(s.k==='proj'&&a.t===8){LU.proj.push({x:f.x+f.face*50,y:f.y-80*f.scale/1.75,vx:f.face*10,e:s.e,team:f.team,own:f,l:120,big:f.id==='narutoSS'||f.id==='romano'});}
      if(s.k==='area'&&a.t===8){for(const g of LU.fs)if(g.team!==f.team&&!g.ko&&Math.abs(g.x-f.x)<150)luHit(f,g,18*f.F.pow,10,30);for(let i=0;i<12;i++)LU.parts.push({x:f.x,y:f.y-60,vx:Math.cos(i/12*6.28)*7,vy:Math.sin(i/12*6.28)*5,l:30,emo:s.e,s:0});}
      if(s.k==='dash'&&act){f.vx=f.face*15;for(const g of LU.fs)if(g.team!==f.team&&!g.ko&&!a.hit[LU.fs.indexOf(g)]&&Math.abs(g.x-f.x)<70&&Math.abs(g.y-f.y)<90){a.hit[LU.fs.indexOf(g)]=1;luHit(f,g,17*f.F.pow,13,34);}}}
    else if(act){const rng=a.k==='kick'?66:a.k==='air'?60:54;const dmg=(a.k==='kick'?11:a.k==='air'?9:6)*f.F.pow;
      for(const g of LU.fs){if(g.team===f.team||g.ko||a.hit[LU.fs.indexOf(g)])continue;const dx=(g.x-f.x)*f.face;
        if(dx>-10&&dx<rng*f.scale/1.75+20&&Math.abs((g.y-40)-(f.y-40))<80){a.hit[LU.fs.indexOf(g)]=1;luHit(f,g,dmg,a.k==='kick'?9:3.5,a.k==='kick'?24:14);}}}
    if(a.t>=a.dur){f.atk=null;}}
  // física
  f.vy+=.8;f.y+=f.vy;if(f.y>=GY){f.y=GY;f.vy=0;}
  f.x+=f.vx;if(f.stun>0||f.atk&&f.atk.k!=='sp')f.vx*=.82;
  if(!(LU.kind==='royale'&&f.t<50))f.x=clamp(f.x,40,W-40);
  f.t++;f.anim+=Math.abs(f.vx)*.2;
}

function updateLucha(){
  const U=LU;U.t++;U.pt++;if(U.shake>0)U.shake--;
  if(U.slow>0){U.slow--;if(U.t%3!==0)return;}
  if(U.phase==='intro'){if(U.pt>(U.kind==='duel'?100:120)){U.phase='fight';U.pt=0;}for(const f of U.fs){f.vy+=.8;f.y=Math.min(GY,f.y+f.vy);if(f.y>=GY)f.vy=0;}return;}
  for(const f of U.fs)luStep(f);
  // empuje entre luchadores
  for(let i=0;i<U.fs.length;i++)for(let j=i+1;j<U.fs.length;j++){const a=U.fs[i],b=U.fs[j];if(a.ko||b.ko)continue;const d=b.x-a.x;if(Math.abs(d)<40&&Math.abs(a.y-b.y)<60){const p=(40-Math.abs(d))/2*Math.sign(d||1);a.x-=p;b.x+=p;}}
  for(const b of U.proj){b.x+=b.vx;b.l--;for(const g of U.fs){if(g.team===b.team||g.ko)continue;if(Math.abs(g.x-b.x)<40&&Math.abs((g.y-70)-b.y)<70){luHit(b.own,g,(b.big?20:15)*b.own.F.pow,9,28);b.l=0;break;}}if(b.x<-60||b.x>W+60)b.l=0;}
  U.proj=U.proj.filter(b=>b.l>0);
  for(const q of U.parts){q.x+=q.vx;q.y+=q.vy;q.l--;if(q.heal){q.vy+=.4;if(q.y>GY-20){q.y=GY-20;q.vy=0;}const m=U.me;if(!m.ko&&Math.abs(m.x-q.x)<40){q.l=0;m.hp=Math.min(m.maxhp,m.hp+25);SFX.heal();luText(m.x,m.y-150,'+25 ❤','#7aff9a');}}}
  U.parts=U.parts.filter(q=>q.l>0);for(const q of U.texts){q.y-=.7;q.l--;}U.texts=U.texts.filter(q=>q.l>0);
  if(U.kind==='duel'){
    if(U.phase==='fight'){U.time--;if(U.time<=0){const w=U.me.hp>=U.rival.hp?0:1;U.wins[w]++;U.phase='ko';U.pt=0;luText(W/2,200,'¡TIEMPO!','#ffe066');}}
    if(U.phase==='ko'&&U.pt>150){
      if(U.wins[0]>=2||U.wins[1]>=2){luEnd(U.wins[0]>=2);return;}
      U.round++;const keepMe=U.me.id,keepR=U.rival.id;const m2=Object.assign(mkFighter(keepMe,0,200,{human:true}),{meter:U.me.meter});const r2=Object.assign(mkFighter(keepR,1,W-200,{lvl:U.o.lvl||.55,hpMul:U.o.hpMul||1}),{meter:U.rival.meter});
      U.fs=[m2,r2];U.me=m2;U.rival=r2;U.proj=[];U.phase='intro';U.pt=0;U.time=60*60;say('¡Ronda '+(U.round===2?'dos':'final')+'! ¡Pelea!',{interrupt:true,pitch:.9});}
  }else{
    if(U.phase==='fight'){if(U.t%40===0)luSpawn();
      if(U.me.ko&&U.me.kot>90){U.lives=(U.lives===undefined?2:U.lives)-1;if(U.lives<0){luEnd(false);return;}U.me.ko=false;U.me.hp=U.me.maxhp;U.me.inv=120;U.me.y=GY-200;luText(U.me.x,200,'¡Otra vida!','#7aff9a');}
      if(!U.paq&&U.kills>=U.toKill-5){U.paq={t:0};say('¡¡¡Paquitoooo!!!',{interrupt:true,pitch:.85});SFX.ssj();}
      if(U.t%90===0){const f=U.fs[Math.floor(Math.random()*U.fs.length)];if(f&&!f.ko&&!f.human)luSay(f,Math.random()<.5?INSULTOS[Math.floor(Math.random()*INSULTOS.length)]:f.F.q[Math.floor(Math.random()*f.F.q.length)]);}}
    if(U.paq){U.paq.t++;if(U.paq.t===170){for(const f of U.fs)if(f.team===1&&!f.ko){luKO(f,{x:W/2,team:0});}U.queue=[];U.shake=20;}
      if(U.paq.t>200&&!U.fs.some(f=>f.team===1&&!f.ko)&&U.phase!=='win'){U.phase='win';U.pt=0;say('¡La tangana es del Comando!',{interrupt:false});SFX.win();}}
    if(U.phase==='win'&&U.pt>220)luEnd(true);
  }
}
function luEnd(won){const o=LU.o;mode='menu';setTouchVisible();musicStop();
  if(won){SFX.win();if(o.onWin)o.onWin();else showMenu();}else{SFX.lose();
    const f=['¡Te han dao más que a una estera!','¡K.O.! Vete pal carajo… y vuelve a intentarlo.','¡Ojú, qué paliza!'][Math.floor(Math.random()*3)];
