/* ---------- dibujo ---------- */
function luLook(f){const l=LOOKS[f.lookOv||f.F.look];return l;}
function drawFighter(c,f){
  const look=luLook(f);if(!look)return;const sc=f.scale;
  if(f.inv>0&&Math.floor(f.inv/4)%2)return;
  c.save();c.fillStyle='rgba(0,0,0,.25)';c.beginPath();c.ellipse(f.x,GY+2,28*sc/1.75,7,0,0,7);c.fill();
  c.translate(f.x,f.y);
  if(f.ko){c.rotate(-f.face*Math.min(1.5,f.kot*.08));}
  else if(f.atk){const a=f.atk;const lean=a.k==='kick'?.32:a.k==='sp'?.25:.18;c.rotate(f.face*lean*Math.sin(Math.min(1,a.t/a.dur)*Math.PI));}
  else if(f.stun>0)c.rotate(-f.face*.15);
  else if(f.blk)c.scale(1,.86);
  c.scale(sc,sc);drawPerson(c,0,0,look,f.face,f.anim*1.4,Math.abs(f.vx)>.6&&f.y>=GY-1,f.flash>0&&f.flash%4<2);c.restore();
  if(f.atk&&!f.ko){const a=f.atk;const p=Math.sin(Math.min(1,a.t/a.dur)*Math.PI);
    if(a.k==='punch')emo(c,'👊',f.x+f.face*(28+34*p)*sc/1.75,f.y-62*sc/1.75,30,f.face<0);
    if(a.k==='kick'||a.k==='air')emo(c,'🦶',f.x+f.face*(30+40*p)*sc/1.75,f.y-(a.k==='air'?30:34)*sc/1.75,34,f.face<0);
    if(a.k==='sp'&&f.F.sp.k==='dash'){emo(c,f.F.sp.e,f.x+f.face*50,f.y-70,46,f.face<0);c.fillStyle='rgba(255,230,80,.35)';c.beginPath();c.ellipse(f.x,f.y-60,60,70,0,0,7);c.fill();}
    if(a.k==='sp'&&f.F.sp.k==='area'){c.strokeStyle='rgba(255,220,80,'+(1-a.t/a.dur)+')';c.lineWidth=8;c.beginPath();c.arc(f.x,f.y-60,a.t*7,0,7);c.stroke();}}
  if(f.blk&&!f.ko)emo(c,'🛡️',f.x+f.face*30,f.y-70,26);
  if(f.stun>0&&!f.ko)emo(c,'💫',f.x,f.y-125*sc/1.75,22);
}
function renderLucha(){const U=LU,c=ctx;const sh=U.shake>0?rnd(-U.shake,U.shake):0;
  c.save();c.translate(sh,sh*.4);drawBG(c,U.th,U.t*.3,U.t);
  c.fillStyle=U.th.fill||'#7a5a3a';c.fillRect(-20,GY,W+40,H-GY+20);c.fillStyle=U.th.top||'#4fbf4a';c.fillRect(-20,GY,W+40,10);
  if(U.kind==='royale'){c.fillStyle='rgba(255,255,255,.75)';c.fillRect(-20,GY+30,W+40,3);for(let i=0;i<40;i++){const x=(i*31)%W,y=GY-190+(i%3)*14;c.fillStyle=['#e2362f','#7fc8f8','#ffd23a','#fff'][i%4];c.beginPath();c.arc(x,y+Math.sin(U.t*.2+i)*3,6,0,7);c.fill();}}
  const order=U.fs.slice().sort((a,b)=>(a.ko?0:1)-(b.ko?0:1));for(const f of order)drawFighter(c,f);
  for(const b of U.proj){emo(c,b.e,b.x,b.y,b.big?56:40,b.vx<0,U.t*.3);c.fillStyle='rgba(255,240,150,.3)';c.beginPath();c.arc(b.x,b.y,26,0,7);c.fill();}
  for(const q of U.parts){c.globalAlpha=Math.min(1,q.l/15);emo(c,q.emo,q.x,q.y,q.heal?34:30);}c.globalAlpha=1;
  for(const f of U.fs)if(f.bub&&!f.ko)bubble(c,f.x,f.y-120*f.scale/1.75,f.bub.text,f.F.n,0);
  for(const q of U.texts){c.globalAlpha=Math.min(1,q.l/20);hudText(c,q.s,q.x,q.y,q.c,26,'center');}c.globalAlpha=1;
  c.restore();
  // HUD
  const bar=(x,y,w,f,right)=>{c.fillStyle='rgba(26,18,56,.8)';rr(c,x-4,y-4,w+8,30,8);c.fill();c.fillStyle='#5a1010';rr(c,x,y,w,22,6);c.fill();const fr=clamp(f.hp/f.maxhp,0,1);c.fillStyle=fr<.3?'#ff4a4a':'#ffd23a';if(right)rr(c,x+w*(1-fr),y,w*fr,22,6);else rr(c,x,y,w*fr,22,6);c.fill();
    c.fillStyle='#333';rr(c,x,y+28,w*.6,8,4);c.fill();c.fillStyle=f.meter>=100?(Math.floor(U.t/6)%2?'#7affea':'#fff'):'#5ab0ff';rr(c,x,y+28,w*.6*f.meter/100,8,4);c.fill();
    const pc=portraitCache(f.lookOv||f.F.look);c.drawImage(pc,right?x+w+8:x-46,y-6,38,44);hudText(c,f.F.n,right?x+w:x,y+56,'#fff',15,right?'right':'left');if(f.meter>=100)hudText(c,'⚡ ESPECIAL',right?x+w*.4:x+w*.6+8,y+38,'#7affea',12,right?'right':'left');};
  if(U.kind==='duel'){bar(60,16,320,U.me,false);bar(W-420,66,320,U.rival,true);hudText(c,String(Math.ceil(U.time/60)),W/2,46,'#fff',34,'center');
    for(let i=0;i<2;i++){emo(c,i<U.wins[0]?'⭐':'◽',W/2-40-i*22,72,18);emo(c,i<U.wins[1]?'⭐':'◽',W/2+40+i*22,72,18);}
    if(U.phase==='intro'){hudText(c,U.round===3?'RONDA FINAL':'RONDA '+U.round,W/2,H/2-30,'#ffe066',52,'center');if(U.pt>55)hudText(c,'¡PELEA!',W/2,H/2+30,'#fff',58,'center');}
    if(U.phase==='ko'&&U.pt<120)hudText(c,'K.O.',W/2,H/2,'#ff4a4a',96,'center');}
  else{bar(60,16,320,U.me,false);hudText(c,'Quedan del Clan: '+Math.max(0,U.toKill-U.kills),W-30,92,'#ffb0b0',20,'right');hudText(c,'Vidas: '+((U.lives===undefined?2:U.lives)+1),W-30,116,'#fff',16,'right');
    if(U.phase==='intro'){hudText(c,'LA GRAN TANGANA DEL SIGLO',W/2,H/2-40,'#ffe066',44,'center');hudText(c,'¡Todos contra todos en La Catedral!',W/2,H/2+4,'#fff',22,'center');}
    if(U.paq){const t=U.paq.t;if(t<120){c.fillStyle='rgba(255,255,255,'+Math.max(0,.55-t/240)+')';c.fillRect(0,0,W,H);hudText(c,'¡¡¡PAQUITOOOO!!!',W/2,H/2-60,'#ffe066',60,'center');}
      const fx=-200+(t-30)*8;if(fx<W+200)drawFalcon(c,fx,110,2.6);if(t>150&&t<230)hudText(c,'¡Bajan la Legión, los rapaos y los piratas de Big Kuki!',W/2,190,'#7aff9a',22,'center');}
    if(U.phase==='win')hudText(c,'¡LA TANGANA ES DEL COMANDO!',W/2,H/2-20,'#ffe066',46,'center');}
  hudText(c,'ACCIÓN = golpe (3 seguidos: combo) · ▼ = cubrirse · ⚡ / ▼+ACCIÓN = especial',W/2,H-10,'rgba(255,255,255,.85)',12,'center');
  if(paused){c.fillStyle='rgba(0,0,0,.4)';c.fillRect(0,0,W,H);}
}

function showLuchaSelect(o){hush();mode='menu';

  const h={back:()=>o.onLose?o.onLose():showMenu()};

}

   <div class="center">${narrBtn('nar')}<button class="btn" id="nx">▶ Mundo ${w+1}: ${WORLDS[w].name}</button><button class="btn alt" id="mw">🗺️ Mundos</button></div></div>`,
   {nx:()=>showWorld(w+1),mw:showWorlds,nar:()=>say(htmlToText(endTxt))});
  say('¡Monstruo vencido! Tienes la carta '+w+' de la Jugada Maestra. '+htmlToText(endTxt));
}
function showEnding(){
  const first=!store.naruto;store.naruto=true;store.finished=true;save();mode='menu';setTouchVisible();
  const g=gemCount();
  const botin=g>=60?'¡EL BOTÍN ENTERO! Con '+g+' joyas, el rey Grego recupera hasta el último anillo… y ni se acuerda de la corona. Lingotes de Mamazonia para el Comando y los mejores zafios del año para Mistery.':
    g>=30?'Con '+g+' joyas, el rey recupera la mitad de sus cosas. Del resto se ha quedado alguna «extraviada» por el camino. La corona, como sabéis, sigue a buen recaudo en el dormitorio de Estresy Brenes.':
    'Solo '+g+' joyas… El rey se queda a medias y con la mosca detrás de la oreja. (Vuelve a las fases a buscar las joyas que faltan.)';
  const txt=`<p class="quote" style="font-style:normal;font-size:18px">💎 <b>EL BOTÍN:</b> ${botin}</p>`+EPILOGO2;
  showOverlay(`<div class="card story"><h2 class="title center">Capítulo 23 · Una paz inusual</h2>${first?'<p class="center"><span class="warn">🔓 ¡Has desbloqueado a ROMANO ASPAS (en fases y en La Tangana)!</span></p>':''}
   <p class="center" style="font-weight:900">💎 ${g}/${NG()} joyas · 🃏 ${pieceCount()}/${NW()} cartas</p>${txt}
   <hr style="border:0;border-top:3px dashed #000;margin:18px 0">
   <p class="center tiny">Basado en <b>«El Planeta de los Zafios II · Misión Amiguetes on Paradise»</b> (2023-2024),<br>de <b>Marco Antonio Saborido Domínguez</b>. Calificación +18.<br>Relato basado en hechos reales en un mínimo porcentaje, con personajes en su mayoría ficticios que nada tienen que ver con la realidad, aunque parezca mentira.</p>
   <div class="center">${narrBtn('nar')}<button class="btn" id="m">🗺️ Mundos</button><button class="btn alt" id="pd">📖 Zafiopedia</button><button class="btn alt" id="lu">🥊 La Tangana</button></div></div>`,{m:showWorlds,pd:showPedia,lu:startLadder,nar:()=>say(htmlToText(txt))});
  SFX.win();say(htmlToText(txt));
}
